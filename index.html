/* ================= EVENTS ================= */
function bindEvents(){
  document.querySelectorAll("[data-tab]").forEach(btn=>{
    btn.onclick = ()=>{ activeTab = btn.dataset.tab; closeAllCalendars(); render(); };
  });
  document.querySelectorAll("[data-section]").forEach(btn=>{
    btn.onclick = ()=>{ activeSection = btn.dataset.section; closeAllCalendars(); render(); };
  });
  const ys = document.getElementById("year-select");
  if (ys) ys.onchange = ()=>{ selYear = Number(ys.value); render(); };

  // Agent picker
  const agentSelect = document.getElementById("agent-select");
  if (agentSelect) agentSelect.onchange = ()=>{ state.currentAgent = agentSelect.value; syncAgentFormState(); saveState(); render(); };
  const btnRenameAgent = document.getElementById("btn-rename-agent");
  if (btnRenameAgent) btnRenameAgent.onclick = ()=>{
    const oldName = state.currentAgent;
    const newName = window.prompt("เปลี่ยนชื่อตัวแทน:", oldName);
    if (!newName || !newName.trim() || newName.trim()===oldName) return;
    const trimmed = newName.trim();
    if (state.agents[trimmed]){ showToast("มีชื่อนี้อยู่แล้ว"); return; }
    state.agents[trimmed] = state.agents[oldName];
    delete state.agents[oldName];
    state.currentAgent = trimmed;
    saveState(); render();
  };
  const btnDeleteAgent = document.getElementById("btn-delete-agent");
  if (btnDeleteAgent) btnDeleteAgent.onclick = ()=>{
    const name = state.currentAgent;
    if (!window.confirm(`ลบข้อมูลทั้งหมดของ "${name}" ใช่หรือไม่? การลบนี้ย้อนกลับไม่ได้`)) return;
    delete state.agents[name];
    const remaining = Object.keys(state.agents);
    state.currentAgent = remaining[0];
    syncAgentFormState();
    saveState(); render();
  };
  const btnToggleAddAgent = document.getElementById("btn-toggle-add-agent");
  if (btnToggleAddAgent) btnToggleAddAgent.onclick = ()=>{ addAgentMode = true; newAgentNameInput=""; render(); };
  const btnCancelAddAgent = document.getElementById("btn-cancel-add-agent");
  if (btnCancelAddAgent) btnCancelAddAgent.onclick = ()=>{ addAgentMode = false; render(); };
  const newAgentNameEl = document.getElementById("new-agent-name");
  if (newAgentNameEl){
    newAgentNameEl.oninput = (e)=>{ newAgentNameInput = e.target.value; };
    newAgentNameEl.onfocus = (e)=>e.target.select();
    newAgentNameEl.onkeydown = (e)=>{ if (e.key==="Enter"){ e.preventDefault(); confirmAddAgent(); } };
  }
  const btnConfirmAddAgent = document.getElementById("btn-confirm-add-agent");
  if (btnConfirmAddAgent) btnConfirmAddAgent.onclick = confirmAddAgent;

  // Goals tab
  const goalInput = document.getElementById("goal-fyc-input");
  if (goalInput){
    goalInput.oninput = (e)=>{ goalsFycInput = formatThousands(stripCommas(e.target.value)); e.target.value = goalsFycInput; };
    goalInput.onfocus = (e)=>e.target.select();
    goalInput.onblur = ()=>{
      const raw = Number(stripCommas(goalsFycInput));
      if (!isNaN(raw) && raw>=0){ agent().goals.targetFYC = raw; saveState(); }
      render();
    };
    goalInput.onkeydown = (e)=>{ if (e.key==="Enter"){ e.preventDefault(); e.target.blur(); } };
  }
  // ข้อมูลบัตรตัวแทนและการอบรม — วันที่ 2 ช่องนี้ใช้ปฏิทินกำหนดเองของแอป (ผูกผ่าน data-toggle-cal/data-pick-day ที่อื่นแล้ว) จึงเหลือแค่ช่องข้อความ
  const licenseTextFieldMap = { "license-agent-code":"agentCode", "license-card-number":"cardNumber" };
  Object.keys(licenseTextFieldMap).forEach(id=>{
    const el = document.getElementById(id);
    if (el){
      el.onblur = (e)=>{ agent().license[licenseTextFieldMap[id]] = e.target.value; saveState(); render(); };
      el.onkeydown = (e)=>{ if (e.key==="Enter"){ e.preventDefault(); e.target.blur(); } };
    }
  });
  const trainingToggle = document.getElementById("training-toggle");
  if (trainingToggle){
    trainingToggle.onclick = ()=>{ trainingSectionOpen = !trainingSectionOpen; render(); };
  }
  document.querySelectorAll("[data-remove-training]").forEach(el=>{
    el.onclick = ()=>{
      const idx = Number(el.dataset.removeTraining);
      agent().license.trainings.splice(idx,1);
      saveState(); render();
    };
  });
  const newTrainingNameInput = document.getElementById("new-training-name");
  if (newTrainingNameInput){
    newTrainingNameInput.oninput = (e)=>{ newTrainingDraft.courseName = e.target.value; };
  }
  const addTrainingBtn = document.getElementById("add-training-btn");
  if (addTrainingBtn){
    addTrainingBtn.onclick = ()=>{
      const courseName = newTrainingDraft.courseName.trim();
      if (!courseName) return;
      agent().license.trainings.push({ courseName, trainingDate: newTrainingDraft.date });
      newTrainingDraft = { courseName: "", date: "" };
      saveState(); render();
    };
  }
  const annualGoalInput = document.getElementById("annual-goal-fyc-input");
  if (annualGoalInput){
    annualGoalInput.oninput = (e)=>{ annualGoalsFycInput = formatThousands(stripCommas(e.target.value)); e.target.value = annualGoalsFycInput; };
    annualGoalInput.onfocus = (e)=>e.target.select();
    annualGoalInput.onblur = ()=>{
      const raw = Number(stripCommas(annualGoalsFycInput));
      if (!isNaN(raw) && raw>=0){ agent().goals.annualTargetFYC = raw; saveState(); }
      render();
    };
    annualGoalInput.onkeydown = (e)=>{ if (e.key==="Enter"){ e.preventDefault(); e.target.blur(); } };
  }
  const goalStartMonth = document.getElementById("goal-start-month");
  if (goalStartMonth){
    goalStartMonth.onchange = (e)=>{
      const newStart = Number(e.target.value);
      agent().goals.startMonth = newStart;
      if ((agent().goals.endMonth ?? 11) < newStart) agent().goals.endMonth = newStart;
      saveState(); render();
    };
  }
  const goalEndMonth = document.getElementById("goal-end-month");
  if (goalEndMonth){
    goalEndMonth.onchange = (e)=>{
      agent().goals.endMonth = Number(e.target.value);
      saveState(); render();
    };
  }

  // Team tab — เป้าหมายของ UM
  const umPositionSelect = document.getElementById("um-position-select");
  if (umPositionSelect){
    umPositionSelect.onchange = (e)=>{
      const posValue = e.target.value;
      state.umGoal.position = posValue;
      const pos = UM_POSITIONS.find(p=>p.value===posValue);
      if (pos){
        state.umGoal.targetFYC = pos.cfycYear;
        umGoalsFycInput = formatThousands(String(pos.cfycYear));
      }
      saveState(); render();
    };
  }
  const compareASelect = document.getElementById("compare-pos-a");
  if (compareASelect) compareASelect.onchange = (e)=>{ state.umGoal.compareA = e.target.value; saveState(); render(); };
  const compareBSelect = document.getElementById("compare-pos-b");
  if (compareBSelect) compareBSelect.onchange = (e)=>{ state.umGoal.compareB = e.target.value; saveState(); render(); };
  const umViewAsOfSelect = document.getElementById("um-view-as-of-month");
  if (umViewAsOfSelect) umViewAsOfSelect.onchange = (e)=>{ state.umGoal.viewAsOfMonth = Number(e.target.value); saveState(); render(); };
  document.querySelectorAll("[data-qty-override]").forEach(inp=>{
    inp.oninput = (e)=>{ const f = formatThousands(stripCommas(e.target.value)); e.target.value = f; };
    inp.onfocus = (e)=>e.target.select();
    inp.onkeydown = (e)=>{ if (e.key==="Enter"){ e.preventDefault(); e.target.blur(); } };
    inp.onblur = (e)=>{
      const key = inp.dataset.qtyOverride;
      const raw = stripCommas(e.target.value.trim());
      if (raw===""){ delete state.umGoal.monthOverrides[key]; }
      else{
        const num = Number(raw);
        if (!isNaN(num) && num>=0){ if(!state.umGoal.monthOverrides) state.umGoal.monthOverrides={}; state.umGoal.monthOverrides[key] = num; }
      }
      saveState(); render();
    };
  });
  document.querySelectorAll("[data-direct-override]").forEach(inp=>{
    inp.oninput = (e)=>{ const f = formatThousands(stripCommas(e.target.value)); e.target.value = f; };
    inp.onfocus = (e)=>e.target.select();
    inp.onkeydown = (e)=>{ if (e.key==="Enter"){ e.preventDefault(); e.target.blur(); } };
    inp.onblur = (e)=>{
      const key = inp.dataset.directOverride;
      const raw = stripCommas(e.target.value.trim());
      if (raw===""){ delete state.umGoal.directOverrides[key]; }
      else{
        const num = Number(raw);
        if (!isNaN(num) && num>=0){ if(!state.umGoal.directOverrides) state.umGoal.directOverrides={}; state.umGoal.directOverrides[key] = num; }
      }
      saveState(); render();
    };
  });
  document.querySelectorAll("[data-qty-reset]").forEach(btn=>{
    btn.onclick = ()=>{
      delete state.umGoal.monthOverrides[btn.dataset.qtyReset];
      saveState(); render();
    };
  });
  document.querySelectorAll("[data-premium-agent]").forEach(inp=>{
    inp.oninput = (e)=>{ const f = formatThousands(stripCommas(e.target.value)); e.target.value = f; };
    inp.onfocus = (e)=>e.target.select();
    inp.onkeydown = (e)=>{ if (e.key==="Enter"){ e.preventDefault(); e.target.blur(); } };
    inp.onblur = (e)=>{
      const agentName = inp.dataset.premiumAgent;
      const idx = Number(inp.dataset.premiumIdx);
      const premiums = getNormalizedPremiums(agentName);
      premiums[idx].amount = e.target.value.trim();
      if (!state.umGoal.newAgentPremiums) state.umGoal.newAgentPremiums = {};
      state.umGoal.newAgentPremiums[agentName] = premiums;
      saveState(); render();
    };
  });
  const umGoalInput = document.getElementById("um-goal-fyc-input");
  if (umGoalInput){
    umGoalInput.oninput = (e)=>{ umGoalsFycInput = formatThousands(stripCommas(e.target.value)); e.target.value = umGoalsFycInput; };
    umGoalInput.onfocus = (e)=>e.target.select();
    umGoalInput.onblur = ()=>{
      const raw = Number(stripCommas(umGoalsFycInput));
      if (!isNaN(raw) && raw>=0){ state.umGoal.targetFYC = raw; saveState(); }
      render();
    };
    umGoalInput.onkeydown = (e)=>{ if (e.key==="Enter"){ e.preventDefault(); e.target.blur(); } };
  }
  const umGoalStartMonth = document.getElementById("um-goal-start-month");
  if (umGoalStartMonth){
    umGoalStartMonth.onchange = (e)=>{
      const newStart = Number(e.target.value);
      state.umGoal.startMonth = newStart;
      if ((state.umGoal.endMonth ?? 11) < newStart) state.umGoal.endMonth = newStart;
      saveState(); render();
    };
  }
  const umGoalEndMonth = document.getElementById("um-goal-end-month");
  if (umGoalEndMonth){
    umGoalEndMonth.onchange = (e)=>{
      state.umGoal.endMonth = Number(e.target.value);
      saveState(); render();
    };
  }
  document.querySelectorAll("[data-switch-agent]").forEach(row=>{
    row.onclick = ()=>{
      state.currentAgent = row.dataset.switchAgent;
      syncAgentFormState();
      activeTab = "entry";
      activeSection = "agent";
      saveState(); render();
    };
  });

  // Entry form
  const fFyc = document.getElementById("f-fyc");
  if (fFyc){
    fFyc.oninput = (e)=>{
      entryForm.fyc = formatThousands(stripCommas(e.target.value));
      e.target.value = entryForm.fyc;
      const previewEl = document.getElementById("billing-preview");
      if (previewEl) previewEl.innerHTML = renderBillingPreviewHtml();
    };
    fFyc.onfocus = (e)=>e.target.select();
  }
  const fNote = document.getElementById("f-note");
  if (fNote){ fNote.oninput = (e)=>{ entryForm.note = e.target.value; }; fNote.onfocus=(e)=>e.target.select(); }
  document.querySelectorAll('input[name="f-billing"]').forEach(r=>{
    r.onchange = (e)=>{ entryForm.billing = e.target.value; render(); };
  });
  const submitBtn = document.getElementById("btn-submit-entry");
  if (submitBtn) submitBtn.onclick = submitEntry;

  document.querySelectorAll("[data-start-edit]").forEach(btn=>{
    btn.onclick = ()=>{
      const id = Number(btn.dataset.startEdit);
      const e = agent().entries.find(x=>x.id===id);
      editingId = id;
      editDraft = { date: e.date, fyc: formatThousands(String(e.fyc)), note: e.note||"" };
      render();
    };
  });
  document.querySelectorAll("[data-cancel-edit]").forEach(btn=>{ btn.onclick = ()=>{ editingId=null; render(); }; });
  document.querySelectorAll("[data-save-edit]").forEach(btn=>{
    btn.onclick = ()=>{
      const id = Number(btn.dataset.saveEdit);
      const rawFyc = stripCommas(editDraft.fyc);
      if (!editDraft.date || !rawFyc || isNaN(Number(rawFyc)) || Number(rawFyc)<=0) return;
      const idx = agent().entries.findIndex(x=>x.id===id);
      if (idx>=0) agent().entries[idx] = { ...agent().entries[idx], date: editDraft.date, fyc: Number(rawFyc), note: editDraft.note.trim() };
      saveState(); editingId=null; render();
    };
  });
  document.querySelectorAll('[data-edit-field="note"]').forEach(inp=>{ inp.oninput=(e)=>{editDraft.note=e.target.value;}; inp.onfocus=(e)=>e.target.select(); });
  document.querySelectorAll('[data-edit-field="fyc"]').forEach(inp=>{ inp.oninput=(e)=>{editDraft.fyc=formatThousands(stripCommas(e.target.value)); e.target.value=editDraft.fyc;}; inp.onfocus=(e)=>e.target.select(); });
  document.querySelectorAll("[data-remove]").forEach(btn=>{
    btn.onclick = ()=>{
      const id = Number(btn.dataset.remove);
      agent().entries = agent().entries.filter(e=>e.id!==id);
      saveState(); render();
    };
  });

  const exportBtn = document.getElementById("btn-export");
  if (exportBtn) exportBtn.onclick = ()=>{
    const blob = new Blob([JSON.stringify(state,null,2)],{type:"application/json"});
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href=url; a.download=`ped-dashboard-backup-${new Date().toISOString().slice(0,10)}.json`;
    a.click(); URL.revokeObjectURL(url);
  };
  const importBtn = document.getElementById("btn-import");
  const fileInput = document.getElementById("file-import");
  if (importBtn && fileInput){
    importBtn.onclick = ()=>fileInput.click();
    fileInput.onchange = (e)=>{
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = ()=>{
        try{
          const imported = JSON.parse(reader.result);
          state = normalizeState(imported);
          syncAgentFormState();
          saveState(); render();
          showToast("นำเข้าข้อมูลสำเร็จ");
        }catch(err){ showToast("ไฟล์ไม่ถูกต้อง นำเข้าไม่สำเร็จ"); }
      };
      reader.readAsText(file);
      fileInput.value = "";
    };
  }

  // Competitions tab
  document.querySelectorAll("[data-persist-band]").forEach(sel=>{
    sel.onchange = ()=>{
      agent().persistQuarterly[sel.dataset.persistBand] = Number(sel.value);
      saveState(); render();
    };
  });
  const item3HypInput = document.getElementById("item3-hypothetical-input");
  if (item3HypInput){
    const resultEl = document.getElementById("item3-hypothetical-result");
    const recompute = ()=>{
      const raw = Number(stripCommas(item3HypInput.value)) || 0;
      const curCfyc = Number(item3HypInput.dataset.currentCfyc);
      const quota3v = Number(item3HypInput.dataset.quota3);
      const posValue = item3HypInput.dataset.position;
      const table = NEW_AGENT_PROFIT_TABLE[posValue];
      if (raw<=0){ resultEl.innerHTML = ''; return; }
      const hypTotal = curCfyc + raw;
      const hypExcess = Math.max(0, hypTotal - quota3v);
      const hypPct = quota3v>0 ? (hypExcess/quota3v)*100 : 0;
      const hypBandIdx = hypExcess>0 ? newAgentProfitBandIndex(hypPct) : -1;
      if (hypBandIdx<0){
        resultEl.innerHTML = `<div style="color:var(--bad);">ถ้าเพิ่ม ${formatThousands(String(raw))} (รวมเป็น ${formatThousands(String(hypTotal))}) ยังไม่เกินโควตา ${formatThousands(String(quota3v))} จึงยังไม่ได้โบนัสข้อนี้</div>`;
        return;
      }
      const hypRate = table.rates[hypBandIdx];
      const hypFlat = table.amounts ? table.amounts[hypBandIdx] : 0;
      const hypBonus = (hypExcess*hypRate/100) + hypFlat;
      const nextIdx = hypBandIdx+1;
      let nextNote = 'อยู่ขั้นสูงสุดแล้ว';
      if (nextIdx < NEW_AGENT_PROFIT_BAND_MIN_PCT.length){
        const nextMinPct = NEW_AGENT_PROFIT_BAND_MIN_PCT[nextIdx];
        const nextExcessNeeded = (nextMinPct/100)*quota3v;
        const shortfall = Math.max(0, nextExcessNeeded - hypExcess);
        const nextRate = table.rates[nextIdx];
        const nextFlat = table.amounts ? table.amounts[nextIdx] : 0;
        const nextBonus = (nextExcessNeeded*nextRate/100) + nextFlat;
        nextNote = `ขาดอีก ${formatThousands(String(Math.round(shortfall)))} จะขยับเป็นอัตรา ${nextRate}% (ได้เพิ่มเป็น ${formatThousands(String(Math.round(nextBonus)))})`;
      }
      resultEl.innerHTML = `<div style="color:var(--navy);">ถ้าเพิ่ม ${formatThousands(String(raw))} (รวมเป็น ${formatThousands(String(hypTotal))}) → โบนัสประมาณ <b style="color:var(--good);">${formatThousands(String(Math.round(hypBonus)))}</b> (อัตรา ${hypRate}%)</div><div style="color:var(--gold);font-weight:600;margin-top:2px;">🎯 ${nextNote}</div>`;
    };
    item3HypInput.oninput = (e)=>{ e.target.value = formatThousands(stripCommas(e.target.value)); recompute(); };
    item3HypInput.onfocus = (e)=>e.target.select();
  }
  document.querySelectorAll("[data-fyc-override]").forEach(inp=>{
    inp.oninput = (e)=>{ const f = formatThousands(stripCommas(e.target.value)); e.target.value = f; };
    inp.onfocus = (e)=>e.target.select();
    inp.onkeydown = (e)=>{ if (e.key==="Enter"){ e.preventDefault(); e.target.blur(); } };
    inp.onblur = (e)=>{
      const key = inp.dataset.fycOverride;
      const raw = stripCommas(e.target.value.trim());
      if (!agent().competitions.monthlyFycOverride) agent().competitions.monthlyFycOverride = {};
      if (raw===""){ delete agent().competitions.monthlyFycOverride[key]; }
      else{
        const num = Number(raw);
        if (!isNaN(num) && num>=0){ agent().competitions.monthlyFycOverride[key] = num; }
      }
      saveState(); render();
    };
  });
  const annualPersistSel = document.querySelector("[data-annual-persist-band]");
  if (annualPersistSel){
    annualPersistSel.onchange = ()=>{
      agent().persistQuarterly[`annual-${selYear}`] = Number(annualPersistSel.value);
      saveState(); render();
    };
  }

  // Date pickers (delegated)
  document.querySelectorAll("[data-toggle-cal]").forEach(btn=>{
    btn.onclick = (e)=>{
      e.stopPropagation();
      const id = btn.dataset.toggleCal;
      const isoVal = getIsoForPicker(id);
      const wasOpen = calState(id).open;
      closeAllCalendars();
      if (!wasOpen){
        const cs = calState(id);
        const d = isoVal ? new Date(isoVal+"T00:00:00") : new Date();
        cs.viewYear = d.getFullYear(); cs.viewMonth = d.getMonth();
        cs.open = true;
      }
      render();
    };
  });
  document.querySelectorAll("[data-shift-month]").forEach(btn=>{
    btn.onclick = (e)=>{
      e.stopPropagation();
      const raw = btn.dataset.shiftMonth;
      const sep = raw.lastIndexOf("|");
      const id = raw.slice(0,sep), delta = raw.slice(sep+1);
      const cs = calState(id);
      let m = cs.viewMonth + Number(delta), y = cs.viewYear;
      if (m<0){m=11;y-=1;} if (m>11){m=0;y+=1;}
      cs.viewMonth=m; cs.viewYear=y;
      render();
    };
  });
  document.querySelectorAll("[data-year-select-cal]").forEach(sel=>{
    sel.onchange = (e)=>{
      e.stopPropagation();
      const id = sel.dataset.yearSelectCal;
      calState(id).viewYear = Number(sel.value);
      render();
    };
  });
  document.querySelectorAll("[data-pick-day]").forEach(btn=>{
    btn.onclick = (e)=>{
      e.stopPropagation();
      const raw = btn.dataset.pickDay;
      const sep = raw.lastIndexOf("|");
      const id = raw.slice(0,sep), day = raw.slice(sep+1);
      const cs = calState(id);
      const iso = `${cs.viewYear}-${String(cs.viewMonth+1).padStart(2,"0")}-${String(Number(day)).padStart(2,"0")}`;
      cs.open = false;
      setIsoForPicker(id, iso);
      render();
    };
  });
  // close calendars when clicking outside any date-wrap
  document.querySelectorAll(".date-wrap").forEach(wrap=>{
    wrap.addEventListener("click", (e)=>e.stopPropagation());
  });
}

function closeAllCalendars(){
  Object.keys(calendars).forEach(id=>{ calendars[id].open=false; });
}
function closeAllCalendarsAndRender(){
  const anyOpen = Object.values(calendars).some(c=>c.open);
  if (anyOpen){ closeAllCalendars(); render(); }
}

function getIsoForPicker(id){
  if (id==="main") return entryForm.date;
  if (id==="edit") return editDraft.date;
  if (id==="joining") return agent().competitions.firstSaleDate;
  if (id==="license-issue") return agent().license.cardIssueDate;
  if (id==="license-expiry") return agent().license.cardExpiryDate;
  if (id==="new-training") return newTrainingDraft.date;
  if (id.startsWith("premium|")){
    const parts = id.split("|"); // premium|<encodedName>|<idx>
    const name = decodeURIComponent(parts[1]);
    const idx = Number(parts[2]);
    return getNormalizedPremiums(name)[idx].date;
  }
  return "";
}
function setIsoForPicker(id, iso){
  if (id==="main") entryForm.date = iso;
  else if (id==="edit") editDraft.date = iso;
  else if (id==="joining"){ agent().competitions.firstSaleDate = iso; saveState(); }
  else if (id==="license-issue"){ agent().license.cardIssueDate = iso; saveState(); }
  else if (id==="license-expiry"){ agent().license.cardExpiryDate = iso; saveState(); }
  else if (id==="new-training"){ newTrainingDraft.date = iso; }
  else if (id.startsWith("premium|")){
    const parts = id.split("|");
    const name = decodeURIComponent(parts[1]);
    const idx = Number(parts[2]);
    const premiums = getNormalizedPremiums(name);
    premiums[idx].date = iso;
    if (!state.umGoal.newAgentPremiums) state.umGoal.newAgentPremiums = {};
    state.umGoal.newAgentPremiums[name] = premiums;
    saveState();
  }
}

function confirmAddAgent(){
  const name = newAgentNameInput.trim();
  if (!name){ showToast("กรุณากรอกชื่อตัวแทน"); return; }
  if (state.agents[name]){ showToast("มีชื่อนี้อยู่แล้ว"); return; }
  state.agents[name] = JSON.parse(JSON.stringify(DEFAULT_AGENT_DATA));
  state.currentAgent = name;
  addAgentMode = false;
  syncAgentFormState();
  saveState(); render();
}

function installmentLabel(billingMode, i, n){
  // รายเดือน: งวดแรกจ่ายล่วงหน้า 2 เดือน = นับเป็นงวดที่ 1 และงวดที่ 2 พร้อมกัน เดือนถัดไปที่จ่ายจริงจึงเริ่มที่งวดที่ 3
  if (billingMode==="monthly"){
    const totalConceptual = n+1; // 11 รายการจริง แทน 12 งวดตามแนวคิด (เพราะงวดแรกนับ 2 งวดรวด)
    if (i===0) return `ปีที่ 1 งวดที่ 1-2/${totalConceptual}`;
    return `ปีที่ 1 งวดที่ ${i+2}/${totalConceptual}`;
  }
  return `ปีที่ 1 งวดที่ ${i+1}/${n}`;
}
function submitEntry(){
  const errBox = document.getElementById("form-error");
  const rawFyc = stripCommas(entryForm.fyc);
  if (!entryForm.date){ errBox.innerHTML = `<div class="err-box">กรุณาเลือกวันที่ทำสัญญา</div>`; return; }
  if (!entryForm.billing){ errBox.innerHTML = `<div class="err-box">กรุณาเลือกลักษณะการเก็บเบี้ย</div>`; return; }
  if (!rawFyc || isNaN(Number(rawFyc)) || Number(rawFyc)<=0){ errBox.innerHTML = `<div class="err-box">กรุณากรอกยอด FYC ให้ถูกต้อง (มากกว่า 0)</div>`; return; }
  errBox.innerHTML = "";

  const perInstallmentFyc = Number(rawFyc);
  const schedule = buildInstallmentSchedule(entryForm.billing, perInstallmentFyc);
  const n = schedule.length;
  const baseNote = entryForm.note.trim();
  const policyId = `p_${Date.now()}`;
  const list = schedule.map((s,i)=>({
    id: Date.now()+i,
    date: addMonthsToDate(entryForm.date, s.offset),
    fyc: s.amount,
    note: n>1 ? `${baseNote}${baseNote?" ":""}(${installmentLabel(entryForm.billing, i, n)})` : baseNote,
    policyId, installmentIndex:i, installmentTotal:n, billingMode: entryForm.billing,
  }));
  agent().entries.push(...list);
  saveState();
  entryForm = { ...entryForm, fyc:"", note:"", billing:"" };
  render();
  const justAdded = document.getElementById("just-added");
  if (justAdded){
    justAdded.style.display="inline-flex";
    setTimeout(()=>{ if(justAdded) justAdded.style.display="none"; }, 2000);
  }
  if (document.activeElement instanceof HTMLElement) document.activeElement.blur();
}

/* init */
document.addEventListener("click", closeAllCalendarsAndRender);
render();
</script>
