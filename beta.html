/* ================= ENTRY TAB ================= */
function renderBillingPreviewHtml(){
  if (!entryForm.billing || entryForm.billing==="annual") return "";
  const mode = BILLING_MODES.find(m=>m.value===entryForm.billing) || BILLING_MODES[0];
  const rawFyc = Number(stripCommas(entryForm.fyc))||0;
  if (rawFyc<=0) return "";
  const schedule = buildInstallmentSchedule(entryForm.billing, rawFyc);
  const total = schedule.reduce((s,x)=>s+x.amount,0);
  const baseDate = entryForm.date || todayIso();
  const schedRows = schedule.map((x,i)=>`<span style="display:inline-block;margin:2px 6px 2px 0;padding:2px 8px;border-radius:6px;background:#123F6B0D;">${fmtTH(new Date(addMonthsToDate(baseDate,x.offset)+"T00:00:00"),{month:"short",year:"2-digit"})} ${THB(x.amount)}</span>`).join('');
  if (entryForm.billing==="monthly"){
    return `<div style="font-size:16px;color:var(--muted);margin-top:5px;line-height:1.6;">
      งวดแรกเก็บล่วงหน้า 2 เดือน = <b>${THB(rawFyc)}</b> (ตัวเลขที่กรอก ต้องเป็น FYC ของ 2 เดือนรวมกัน) · เว้น 1 เดือน · จากนั้นเดือนละ ${THB(rawFyc/2)} · รวม ${schedule.length} งวด ${THB(total)}
      <div style="margin-top:4px;">${schedRows}</div>
      <div style="font-size:14px;">งวดที่ยังไม่ถึงเดือน จะยังไม่นับเป็นผลงานจนกว่าจะถึงเดือนนั้น</div>
    </div>`;
  }
  return `<div style="font-size:17.25px;color:var(--muted);margin-top:5px;">
    บันทึก ${mode.installments} งวด งวดละ ${THB(rawFyc)} ทุก ${mode.intervalMonths} เดือน รวมทั้งหมด ${THB(total)}
    <div style="margin-top:4px;font-size:16px;">${schedRows}</div>
    <div style="font-size:14px;">งวดที่ยังไม่ถึงเดือน จะยังไม่นับเป็นผลงานจนกว่าจะถึงเดือนนั้น</div>
  </div>`;
}
function billingModeOf(e){
  if (e.billingMode) return e.billingMode;
  // ข้อมูลเก่าไม่มีฟิลด์นี้ ให้เดาจากจำนวนงวดทั้งหมด
  const t = e.installmentTotal ?? 1;
  if (t>=11) return "monthly";
  if (t===4) return "quarterly";
  if (t===2) return "semiannual";
  return "annual";
}
function renderEntryTab(){
  const allAg = fullEntries(agent()); // รวมงวดที่ยังไม่ถึงกำหนดด้วย เพื่อแสดงตารางครบ (แต่ไม่นับในยอดรวม)
  const todayStr = todayIso();
  const isFutureE = (e)=>String(e.date)>todayStr;
  const entries = allAg.filter(e=>D(e.date).getFullYear()===selYear); // ทั้งหมด รวมที่รอพิจารณาด้วย — ใช้แสดงตารางครบทุกแถว
  const sorted = [...entries].sort((a,b)=>D(b.date)-D(a.date));

  // ค้นหาจากหมายเหตุ (ชื่อลูกค้า/เลขกรมธรรม์) หรือชื่อเดือน (ไทย เต็มหรือย่อ) — พิมพ์ชื่อเดือนจะกรองเฉพาะเดือนนั้น ไม่ใช่ค้นข้อความ
  const q = entrySearchQuery.trim().toLowerCase();
  const matchedMonth = q ? THAI_MONTH_NAMES.findIndex(m=>m.toLowerCase().includes(q)) : -1;
  const matchedMonthShort = q ? THAI_MONTH_SHORT.findIndex(m=>m.toLowerCase().replace(/\./g,"").includes(q.replace(/\./g,""))) : -1;
  const monthFilter = matchedMonth>=0 ? matchedMonth : matchedMonthShort;
  const filtered = !q ? sorted
    : monthFilter>=0 ? sorted.filter(e=>D(e.date).getMonth()===monthFilter)
    : sorted.filter(e=>(e.note||"").toLowerCase().includes(q));

  // ยอดรวมทุกตัว (ที่แสดงบนสุดและแถวรวมท้ายตาราง) คำนวณจากผลลัพธ์ที่ค้นหา/กรองอยู่ตอนนี้เท่านั้น ไม่ใช่ทั้งปีเสมอไป
  // สำคัญ: ต้องเช็คสถานะอนุมัติจาก "ข้อมูลทั้งหมดของตัวแทน" ก่อน (เจอต้นฉบับแน่นอนไม่ว่าจะอยู่เดือนไหน) แล้วค่อยกรองลงมาเฉพาะผลค้นหาทีหลัง
  // ถ้ากรองก่อนแล้วค่อยเช็ค (เหมือนที่เคยทำ) งวดต่อเนื่องที่ต้นฉบับอยู่คนละเดือนกับที่ค้นหา จะหาต้นฉบับไม่เจอ แล้วตกหล่นจากยอดรวมไปอย่างผิดๆ
  const effectiveIdSet = new Set(effectiveEntries(allAg).map(e=>e.id));
  const effEntries = filtered.filter(e=>effectiveIdSet.has(e.id) && !isFutureE(e)); // งวดที่ยังไม่ถึงกำหนดไม่นับ // เฉพาะที่นับผลจริงแล้ว ภายในผลลัพธ์ที่กรองอยู่ — ใช้สรุปยอดด้านบน
  const totalFYC = effEntries.reduce((s,e)=>s+e.fyc,0);
  const originCount = effEntries.filter(isOrigin).length;

  const previewHtml = renderBillingPreviewHtml();

  const colTotals = { annual:0, semiannual:0, quarterly:0, monthly:0 };
  effEntries.forEach(e=>{ colTotals[billingModeOf(e)] += e.fyc; });

  let rows = "";
  if (sorted.length===0){
    rows = `<div class="empty">ยังไม่มีรายการในปีนี้ — เริ่มบันทึกผลงานรายแรกด้านบนได้เลย</div>`;
  } else if (filtered.length===0){
    rows = `<div class="empty">ไม่พบรายการที่ตรงกับ "${esc(entrySearchQuery)}"</div>`;
  } else {
    const totalRow = `<tr style="border-top:2px solid #123F6B22;font-weight:700;">
      <td style="color:var(--navy);" colspan="2">รวม</td>
      <td class="num" style="color:var(--navy);">${THB(colTotals.annual)}</td>
      <td class="num" style="color:var(--navy);">${THB(colTotals.semiannual)}</td>
      <td class="num" style="color:var(--navy);">${THB(colTotals.quarterly)}</td>
      <td class="num" style="color:var(--navy);">${THB(colTotals.monthly)}</td>
      <td></td>
      <td></td>
    </tr>`;
    // เช็คสถานะ "รอพิจารณา" ที่แท้จริงของแต่ละงวด — งวดต่อเนื่องอิงตามงวดต้นฉบับเสมอ (ไม่มีสถานะของตัวเอง)
    const originPendingLookup = {};
    allAg.forEach(en=>{ if (isOrigin(en)) originPendingLookup[en.policyId] = !!en.pending; });
    const effectivePendingOf = (en)=> (en.policyId in originPendingLookup) ? originPendingLookup[en.policyId] : !!en.pending;
    rows = `<div style="overflow-x:auto"><table>
      <thead><tr><th>วันที่</th><th>หมายเหตุ</th><th style="text-align:right">รายปี</th><th style="text-align:right">ราย 6 เดือน</th><th style="text-align:right">ราย 3 เดือน</th><th style="text-align:right">รายเดือน</th><th style="text-align:center">อนุมัติ</th><th></th></tr></thead>
      <tbody>${filtered.map(e=>{
        if (editingId===e.id){
          return `<tr style="background:#4FAE7414;">
            <td>${renderDateInput('edit', editDraft.date, true)}</td>
            <td><input type="text" data-edit-field="note" value="${esc(editDraft.note)}" style="padding:5px 7px;font-size:18.75px;width:100%;"></td>
            <td colspan="4" style="text-align:right"><input type="text" inputmode="decimal" data-edit-field="fyc" value="${esc(editDraft.fyc)}" style="padding:5px 7px;font-size:18.75px;text-align:right;width:110px;"></td>
            <td></td>
            <td style="text-align:right;white-space:nowrap;">
              <button class="icon-btn" data-save-edit="${e.id}" title="บันทึก">✔</button>
              <button class="icon-btn" data-cancel-edit="1" title="ยกเลิก">✕</button>
            </td>
          </tr>`;
        }
        const bMode = billingModeOf(e);
        const cell = (match) => match===bMode ? `<td class="num">${THB(e.fyc)}</td>` : `<td class="num" style="color:var(--muted);">—</td>`;
        const origin = isOrigin(e);
        const effPending = effectivePendingOf(e);
        if (!origin && effPending) return ''; // งวดต่อเนื่อง ยังไม่โผล่ในตารางเลยจนกว่าต้นฉบับจะอนุมัติ
        const fut = isFutureE(e);
        return `<tr style="${effPending?'background:#FBF6E844;':''}${fut?'opacity:0.55;':''}">
          <td style="${origin?'color:var(--navy);font-weight:600;':''}${effPending?'opacity:0.7;':''}">${fmtTH(D(e.date),{day:"numeric",month:"long",year:"numeric"})}${fut?'<div style="font-size:13px;color:var(--muted);font-weight:400;">⏳ ยังไม่ถึงงวด (ยังไม่นับ)</div>':''}</td>
          <td style="color:var(--muted)">${esc(e.note)||"—"}${(e.premium||e.plan)?`<div style="font-size:13px;">${e.plan?esc(e.plan):''}${e.plan&&e.premium?' · ':''}${e.premium?'เบี้ย '+THB(e.premium):''}</div>`:''}</td>
          ${cell("annual")}${cell("semiannual")}${cell("quarterly")}${cell("monthly")}
          <td style="text-align:center;">
            ${!origin
              ? `<span style="color:var(--muted);font-size:16px;" title="งวดต่อเนื่อง">—</span>`
              : e.pending
                ? `<button class="icon-btn" data-approve-entry="${e.id}" title="แตะเพื่ออนุมัติ (จะตั้งวันที่เป็นวันนี้ = วันที่อนุมัติ)" style="color:var(--muted);font-size:20px;">⭕</button>`
                : `<button class="icon-btn" data-cancel-approve="${e.id}" title="อนุมัติแล้ว — แตะเพื่อยกเลิก (กลับเป็นรอพิจารณา คืนวันที่เดิม)" style="color:var(--good);font-size:20px;">✅</button>`}
          </td>
          <td style="text-align:right;white-space:nowrap;">
            <button class="icon-btn" data-start-edit="${e.id}" title="แก้ไข">✏️</button>
            <button class="icon-btn" data-remove="${e.id}" title="ลบ">🗑</button>
          </td>
        </tr>`;
      }).join("")}${totalRow}</tbody>
    </table></div>`;
  }

  const billingLabel = entryForm.billing==="" ? "ค่าคอมมิชชั่น" : (entryForm.billing==="annual" ? "ค่าคอมมิชชั่นปีแรก (FYC)" : entryForm.billing==="monthly" ? "FYC งวดแรก (รวม 2 เดือน)" : "ค่าคอมมิชชั่นต่องวด");
  const radiosHtml = BILLING_MODES.map(m=>{
    const sel = entryForm.billing===m.value;
    return `<label style="display:flex;align-items:center;justify-content:center;cursor:pointer;padding:10px 2px;border-radius:8px;border:1.5px solid ${sel?'var(--good)':'#123F6B22'};background:${sel?'var(--good)':'#fff'};font-weight:${sel?700:400};font-size:14px;transition:all .12s;flex:1;min-width:0;text-align:center;">
      <input type="radio" name="f-billing" value="${m.value}" ${sel?"checked":""} style="display:none;">
      <span style="white-space:nowrap;color:${sel?'#fff':'var(--ink)'} !important;">${m.label}</span>
    </label>`;
  }).join("");

  return `
    <div class="card">

      <form id="entry-form" class="entry-form" onsubmit="return false;">
        <label class="field full"><span>วันที่ทำสัญญา</span>${renderDateInput('main', entryForm.date, false)}</label>

        </label>
        <label class="field full"><span>ลักษณะการเก็บเบี้ย</span>
          <div style="display:flex;gap:6px;margin-top:2px;">${radiosHtml}</div>
          <div id="billing-preview">${previewHtml}</div>
        </label>
        <label class="field"><span>เบี้ยประกันต่อปี (ไม่บังคับ)</span>
          <input type="text" inputmode="decimal" id="f-premium" value="${esc(entryForm.premium||'')}" placeholder="ใช้เช็กการแข่งขันแบบเบี้ย/ของสมนาคุณ">

          <input type="text" id="f-plan" list="plan-list" value="${esc(entryForm.plan||'')}" placeholder="เช่น สะสมทรัพย์">

        </label>
        <label class="field full"><span>หมายเหตุ (ไม่บังคับ)</span>
          <input type="text" id="f-note" value="${esc(entryForm.note)}" placeholder="ชื่อลูกค้า / เลขกรมธรรม์">
        </label>
        <label class="full" style="display:flex;align-items:center;gap:8px;font-size:18px;cursor:pointer;">
          <input type="checkbox" id="f-approved" ${entryForm.approved?'checked':''} style="width:20px;height:20px;"> อนุมัติแล้ว <span style="font-size:14px;color:var(--muted);">(ไม่ติ๊ก = บันทึกเป็นรอพิจารณา)</span>
        </label>
        <div id="form-error"></div>
        <div class="full" style="display:flex;align-items:center;gap:12px;">
          <button type="button" class="btn-primary" id="btn-submit-entry">＋ บันทึกรายการ</button>
          <span id="just-added" style="display:none;" class="ok-badge">✔ บันทึกแล้ว</span>
        </div>
      </form>
    </div>
    <div class="card">
      <div style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:10px;">
        <h3>รายการผลงาน พ.ศ. ${toBE(selYear)}</h3>
        <span style="font-size:18.75px;color:var(--muted);">${originCount} ราย · FYC รวม <b style="color:var(--navy)">${THB(totalFYC)}</b></span>
      </div>
      ${q?`<p style="font-size:14px;color:var(--gold);margin:-6px 0 4px;font-weight:600;">🔍 ยอดด้านบนเป็นยอดเฉพาะผลลัพธ์ที่ค้นหาอยู่ ไม่ใช่ทั้งปี</p>`:''}
      <p style="font-size:15px;color:var(--muted);margin:-4px 0 10px;">วันที่สีน้ำเงิน = วันที่ลูกค้าชำระเบี้ยจริง (งวดแรก) ส่วนงวดที่เข้าต่อเนื่องเป็นสีปกติ · แถวจาง = งวดที่ยังไม่ถึงกำหนด ยังไม่นับเป็นผลงานจนกว่าจะถึงเดือนนั้น</p>
      ${sorted.length>0?`<div style="margin-bottom:10px;position:relative;">
        <input type="text" id="entry-search" placeholder="🔍 ค้นหาจากหมายเหตุ หรือชื่อเดือน (เช่น สิงหา)" value="${esc(entrySearchQuery)}" style="width:100%;box-sizing:border-box;padding:8px 34px 8px 12px;">
        ${entrySearchQuery?`<span id="entry-search-clear" style="position:absolute;right:10px;top:50%;transform:translateY(-50%);cursor:pointer;color:var(--muted);font-size:18px;">✕</span>`:''}
      </div>`:''}
      ${rows}
    </div>
  `;
}

/* ================= COMPETITIONS TAB ================= */
function renderCompetitionsTab(){
  const entries = effectiveEntries(agent().entries);
  const yearEntries = entries.filter(e=>D(e.date).getFullYear()===selYear);
  const qResults = quarterlyQualifyResults(entries, selYear);
  const streak = longestConsecutiveStreak(qResults);
  const annualCases = yearEntries.filter(isOrigin).length;
  const annualFYC = yearEntries.reduce((s,e)=>s+e.fyc,0);
  const annualGate = annualCases>=ANNUAL_GATE_CASES && annualFYC>=ANNUAL_GATE_FYC;
  const annualBonusGate = annualCases>=ANNUAL_BONUS_GATE_CASES && annualFYC>=ANNUAL_BONUS_GATE_FYC;
  const achievedLevel = annualGate ? Math.min(streak,4) : 0;
  const reward = achievedLevel>0 ? STREAK_REWARDS[achievedLevel] : 0;
  const hasTrophy = achievedLevel>0;

  const now = new Date();
  const currentActual = getQuarter(todayIso());
  const isCurrentYear = selYear===currentActual.year;
  const currentMonthIdx = now.getMonth();

  const goalFYC = getAgentTargetFYC();
  const goalStartMonth = agent().goals.startMonth ?? 0;
  const goalEndMonth = agent().goals.endMonth ?? 11;
  const pacing = goalFYC>0 ? computeMonthlyPacing(entries, selYear, goalFYC, goalStartMonth, goalEndMonth) : null;

  // Joining bonus
  const startDate = agent().competitions.firstSaleDate;
  let joiningMonths = [], joiningTotalPaid=0, joiningCumCases=0, joiningCumFYC=0, joiningTier=null;
  if (startDate){
    const start = new Date(startDate+"T00:00:00");
    const startY = start.getFullYear(), startM = start.getMonth();
    joiningMonths = [0,1,2,3].map(i=>{
      const y = startY + Math.floor((startM+i)/12);
      const m = (startM+i)%12;
      const list = entries.filter(e=>{ const d=D(e.date); return d.getFullYear()===y && d.getMonth()===m; });
      const count = list.filter(isOrigin).length;
      const fyc = list.reduce((s,e)=>s+e.fyc,0);
      const qualifies = count>=JOINING_MONTHLY_MIN_CASES && fyc>=JOINING_MONTHLY_MIN_FYC;
      return { y, m, count, fyc, qualifies, paid: qualifies?JOINING_MONTHLY_BONUS:0 };
    });
    joiningTotalPaid = joiningMonths.reduce((s,m)=>s+m.paid,0);
    joiningCumCases = joiningMonths.reduce((s,m)=>s+m.count,0);
    joiningCumFYC = joiningMonths.reduce((s,m)=>s+m.fyc,0);
    for (const t of JOINING_CUM_TABLE) if (joiningCumCases>=t.cases && joiningCumFYC>=t.fyc) joiningTier=t;
  }
  const joiningTierBonus = joiningTier ? joiningTier.bonus : 0;
  const joiningTopUp = Math.max(0, Math.min(JOINING_BONUS_CAP, joiningTierBonus) - joiningTotalPaid);
  const joiningGrandTotal = Math.min(JOINING_BONUS_CAP, joiningTotalPaid + joiningTopUp);
  // ขั้นถัดไปของ Joining Bonus: อีกกี่รายหรือเท่าไหร่ถึงจะขยับขั้น และสูงสุดจะได้เท่าไหร่
  const joiningNextTier = JOINING_CUM_TABLE.find(t=>!(joiningCumCases>=t.cases && joiningCumFYC>=t.fyc));
  const joiningCasesShort = joiningNextTier ? Math.max(0, joiningNextTier.cases-joiningCumCases) : 0;
  const joiningFycShort = joiningNextTier ? Math.max(0, joiningNextTier.fyc-joiningCumFYC) : 0;

  // โบนัสไตรมาส (เงินรางวัลตัวแทน ตาราง 4) รวมทั้ง 4 ไตรมาส
  let totalQuarterlyBonus = 0;
  qResults.forEach(r=>{
    const bKey = `${selYear}-Q${r.q}`;
    const bPersist = agent().persistQuarterly[bKey] ?? 80;
    const bQualifies = r.count>=3 && r.fyc>=12500 && bPersist>=75;
    const bPct = quarterlyPct(r.fyc);
    totalQuarterlyBonus += bQualifies ? (r.fyc*bPct)/100 : 0;
  });
  // โบนัสปี (เงินรางวัลตัวแทน ตาราง 4) สุทธิหลังหักส่วนที่จ่ายรายไตรมาสแล้ว
  const annualPersistKey = `annual-${selYear}`;
  const annualPersist = agent().persistQuarterly[annualPersistKey] ?? 80;
  const annualBand = annualPersist>=90?'high':annualPersist>=85?'mid':'low';
  const annualBonusPct = annualBonusGate ? annualPct(annualFYC, annualBand) : 0;
  const annualBonusGross = annualBonusGate ? (annualFYC*annualBonusPct)/100 : 0;
  const annualBonusNet = Math.max(0, annualBonusGross - totalQuarterlyBonus);

  const totalIncome = annualFYC + reward + totalQuarterlyBonus + annualBonusNet + joiningGrandTotal;
  const thMonth = (y,m)=> fmtTH(new Date(y,m,1),{month:"short",year:"2-digit"});

  const qCardsHtml = qResults.map(r=>{
    const isCurrentQuarter = isCurrentYear && r.q===currentActual.quarter;
    const casesShort = Math.max(0, QUALIFY_MIN_CASES - r.count);
    const fycShort = Math.max(0, QUALIFY_MIN_FYC - r.fyc);
    const monthsShort = Math.max(0, QUALIFY_MIN_ACTIVE_MONTHS - r.activeMonths);

    const bKey = `${selYear}-Q${r.q}`;
    const bPersist = agent().persistQuarterly[bKey] ?? 80;
    const bCasesShort = Math.max(0, 3-r.count);
    const bFycShort = Math.max(0, 12500-r.fyc);
    const bPersistShort = Math.max(0, 75-bPersist);
    const bQualifies = r.count>=3 && r.fyc>=12500 && bPersist>=75;
    const bPct = quarterlyPct(r.fyc);
    const bReward = bQualifies ? (r.fyc*bPct)/100 : 0;

    const borderStyle = isCurrentQuarter
      ? `border-top:2.5px solid var(--gold);border-right:2.5px solid var(--gold);border-bottom:2.5px solid var(--gold);border-left:5px solid ${r.qualifies?'var(--good)':'var(--bad)'};box-shadow:0 0 0 4px #4FAE7422;`
      : `border-top:1.5px solid #123F6B22;border-right:1.5px solid #123F6B22;border-bottom:1.5px solid #123F6B22;border-left:5px solid ${r.qualifies?'var(--good)':'var(--bad)'};`;

    let monthRowsHtml = "";
    let qTargetSum = 0, qFycSum = 0, qHasTarget = false;
    const fycOverrides = agent().competitions.monthlyFycOverride || {};
    r.months.forEach((m,i)=>{
      const monthIdx = (r.q-1)*3+i;
      const pm = pacing ? pacing[monthIdx] : null;
      const pmActive = pm && !pm.excluded;
      const ovKey = `${selYear}-${monthIdx}`;
      const ov = fycOverrides[ovKey];
      const isOv = ov!==undefined && ov!==null;
      const displayFyc = Math.round(isOv ? ov : m.fyc);
      qFycSum += displayFyc;
      const hit = pmActive ? displayFyc>=pm.target : null;
      if (pmActive){ qTargetSum += pm.target; qHasTarget = true; }
      const rowBg = (monthIdx===currentMonthIdx && isCurrentYear) ? "background:#4FAE7414;" : "";
      monthRowsHtml += `<tr style="${rowBg}">
        <td style="color:${m.count>0?'var(--navy-deep)':'var(--muted)'};font-weight:${m.count>0?600:400};vertical-align:top;padding-top:8px;">${THAI_MONTH_SHORT[m.month]}</td>
        <td class="r" style="color:${m.count>0?'var(--ink)':'var(--muted)'};vertical-align:top;padding-top:8px;">${m.count}</td>
        ${pacing?`<td class="r" style="color:var(--muted);vertical-align:top;padding-top:8px;">${pmActive?THB(pm.target):'—'}</td>`:''}
        <td class="r" style="vertical-align:top;padding-top:0;">
          <input type="text" inputmode="decimal" data-fyc-override="${ovKey}" value="${esc(formatThousands(String(displayFyc)))}" style="width:98px;padding:4px 5px;font-size:21px;font-weight:700;font-family:'Space Grotesk',sans-serif;text-align:center;color:var(--navy-deep);">
          <div style="font-size:11px;color:${isOv?'var(--gold)':'var(--muted)'};margin-top:2px;">${isOv?'✏️ แก้ไขเอง':'(อัตโนมัติ)'}</div>
        </td>
      </tr>`;
    });
    const qNetDiff = qFycSum - qTargetSum;
    const qTotalRow = `<tr style="border-top:1.5px solid #123F6B22;font-weight:700;">
      <td style="color:var(--navy-deep);">รวม</td>
      <td class="r" style="color:var(--navy-deep);">${r.count}</td>
      ${pacing?`<td class="r" style="color:var(--navy-deep);">${qHasTarget?THB(qTargetSum):'—'}</td>`:''}
      <td class="r" style="color:var(--navy-deep);">${THB(qFycSum)}</td>
    </tr>`;
    const qNetLine = (pacing && qHasTarget) ? `<div style="font-size:16px;margin-top:4px;text-align:right;">
      ${qNetDiff>=0?`<span style="color:var(--good);">เกินสุทธิ ${THB(qNetDiff)}</span>`:`<span style="color:var(--bad);">ขาดสุทธิ ${THB(-qNetDiff)}</span>`}
    </div>` : '';

    return `<div class="qcard" style="${borderStyle}background:${NAVY_TINTS[r.q-1]};">
      ${isCurrentQuarter?`<div class="badge-current">ไตรมาสปัจจุบัน</div>`:''}
      <div class="head"><span>ไตรมาส ${r.q} — คุณวุฒิไตรมาส</span><span>${isCurrentQuarter?'⏳':(r.qualifies?'✔':'✕')}</span></div>
      <div class="mini-row"><span>เดือนที่มีผลงาน</span><span class="v ${r.activeMonths>=QUALIFY_MIN_ACTIVE_MONTHS?'ok':''}">${r.activeMonths}/3 เดือน</span></div>
      ${!r.qualifies?`<div class="alert-box">
        <div class="title">${isCurrentQuarter?'⏳ ไตรมาสนี้ยังไม่จบ — เกณฑ์คุณวุฒิไตรมาส':'⚠ เกณฑ์คุณวุฒิไตรมาสนี้'}</div>
        <div class="line">· จำนวนราย ${casesShort>0?`<span style="color:var(--bad);font-weight:700;">ขาดอีก ${casesShort} ราย (มี ${r.count}/${QUALIFY_MIN_CASES})</span>`:`<span style="color:var(--good);font-weight:700;">ถึงแล้ว (${r.count}/${QUALIFY_MIN_CASES})</span>`}</div>
        <div class="line">· FYC ${fycShort>0?`<span style="color:var(--bad);font-weight:700;">ขาดอีก ${THB(fycShort)} (มี ${THB(r.fyc)}/${THB(QUALIFY_MIN_FYC)})</span>`:`<span style="color:var(--good);font-weight:700;">ถึงแล้ว (${THB(r.fyc)})</span>`}</div>
        <div class="line">· เดือนที่มีผลงาน ${monthsShort>0?`<span style="color:var(--bad);font-weight:700;">ขาดอีก ${monthsShort} เดือน (มี ${r.activeMonths}/${QUALIFY_MIN_ACTIVE_MONTHS})</span>`:`<span style="color:var(--good);font-weight:700;">ถึงแล้ว (${r.activeMonths}/${QUALIFY_MIN_ACTIVE_MONTHS})</span>`}</div>
      </div>`:''}
      <div style="margin-top:10px;padding-top:8px;border-top:1px dashed #123F6B1A;">
        <div style="font-size:16.5px;font-weight:700;color:var(--navy-deep);margin-bottom:6px;">ผลงานรายเดือน${pacing?' เทียบเป้าหมาย':''}</div>
        <table class="qtable">
          <thead><tr><th>เดือน</th><th class="r">ราย</th>${pacing?'<th class="r">เป้า FYC</th>':''}<th class="r">FYC ที่ได้</th></tr></thead>
          <tbody>${monthRowsHtml}${qTotalRow}</tbody>
        </table>
        ${qNetLine}
        ${!pacing?`<div style="font-size:16.5px;color:var(--muted);margin-top:6px;">* ตั้งเป้าหมาย FYC รายปีในแท็บ "เป้าหมาย" เพื่อดูคอลัมน์เป้าหมายรายเดือนที่นี่</div>`:''}
      </div>
      <div class="bonus-box">
        <div class="title">โบนัสไตรมาสนี้ (เงินรางวัลตัวแทน)</div>
        <div class="row">
          <span>อัตราคงอยู่ (ตามช่วงบริษัท)</span>
          <select data-persist-band="${bKey}">${PERSISTENCY_BAND_OPTIONS.map(p=>`<option value="${p.value}" ${p.value===bPersist?"selected":""}>${p.label}</option>`).join("")}</select>
        </div>
        <div class="reward"><span style="font-size:17.25px;color:var(--muted);">อัตรา ${bPct}%</span><span class="amt" style="color:${bQualifies?'var(--good)':'var(--muted)'};">${THB(bReward)}</span></div>
        ${!bQualifies?`<div class="alert-box" style="margin-top:6px;padding:7px 9px;">
          <div class="title" style="font-size:16.5px;">${isCurrentQuarter?'⏳ ไตรมาสนี้ยังไม่จบ — เกณฑ์โบนัสไตรมาส (เงินรางวัลตัวแทน)':'⚠ เกณฑ์โบนัสไตรมาส (เงินรางวัลตัวแทน)'}</div>
          <div class="line" style="font-size:17px;">· จำนวนราย ${bCasesShort>0?`<span style="color:var(--bad);font-weight:700;">ขาดอีก ${bCasesShort} ราย (มี ${r.count}/3)</span>`:`<span style="color:var(--good);font-weight:700;">ถึงแล้ว (${r.count}/3)</span>`}</div>
          <div class="line" style="font-size:17px;">· FYC ${bFycShort>0?`<span style="color:var(--bad);font-weight:700;">ขาดอีก ${THB(bFycShort)} (มี ${THB(r.fyc)}/12,500)</span>`:`<span style="color:var(--good);font-weight:700;">ถึงแล้ว (${THB(r.fyc)})</span>`}</div>
          <div class="line" style="font-size:17px;">· อัตราคงอยู่ ${bPersistShort>0?`<span style="color:var(--bad);font-weight:700;">ขาดอีก ${bPersistShort}% (มี ${bPersist}%/75%)</span>`:`<span style="color:var(--good);font-weight:700;">ถึงแล้ว (${bPersist}%)</span>`}</div>
          <div style="font-size:17px;margin-top:4px;padding-top:4px;border-top:1px dashed #B4453B33;color:var(--good);font-weight:700;">ถ้าครบเกณฑ์ จะได้รับประมาณ ${THB((r.fyc*bPct)/100)} (อัตรา ${bPct}% ของ FYC ปัจจุบัน)</div>
        </div>`:''}
      </div>
    </div>`;
  }).join("");

  const jbCardsHtml = joiningMonths.map((m,i)=>{
    const isCurrentJbMonth = m.y===now.getFullYear() && m.m===now.getMonth();
    return `
    <div class="jbcard" style="border-top:1.5px solid #4FAE7433;border-right:1.5px solid #4FAE7433;border-bottom:1.5px solid #4FAE7433;border-left:5px solid ${isCurrentJbMonth?'var(--gold)':(m.qualifies?'var(--good)':'var(--bad)')};background:${GOLD_TINTS[i]};">
      <div class="head"><span>เดือนที่ ${i+1} (${thMonth(m.y,m.m)})</span><span>${isCurrentJbMonth?'⏳':(m.qualifies?'✔':'✕')}</span></div>
      <div class="mini-row"><span>รายใหม่</span><span class="v ${m.count>=JOINING_MONTHLY_MIN_CASES?'ok':''}">${m.count} ราย</span></div>
      <div class="mini-row"><span>FYC</span><span class="v ${m.fyc>=JOINING_MONTHLY_MIN_FYC?'ok':''}">${THB(m.fyc)}</span></div>
      <div style="margin-top:6px;font-size:17.25px;color:var(--muted);">ได้รับ: <b style="color:${m.paid?'var(--good)':'var(--muted)'};">${THB(m.paid)}</b></div>
    </div>`;
  }).join("");

  // ภาพรวมสถานการณ์: ขั้นถัดไปของโบนัสไตรมาสปัจจุบัน, โบนัสปี, และคุณวุฒิไตรมาสที่ยังไม่ผ่าน
  const curQ = isCurrentYear ? currentActual.quarter : null;
  const curQResult = curQ ? qResults.find(r=>r.q===curQ) : null;
  let qBonusOverview = null;
  if (curQResult){
    const bKey = `${selYear}-Q${curQ}`;
    const bPersist = agent().persistQuarterly[bKey] ?? 80;
    const bQualifies = curQResult.count>=3 && curQResult.fyc>=12500 && bPersist>=75;
    const bPct = quarterlyPct(curQResult.fyc);
    const bReward = bQualifies ? (curQResult.fyc*bPct)/100 : 0;
    const projectedRewardAtCurrentFyc = (curQResult.fyc*bPct)/100; // ถ้าเข้าเกณฑ์รายและอัตราคงอยู่ครบ จะได้เท่านี้จาก FYC ปัจจุบัน
    const casesShortToGate = Math.max(0, 3 - curQResult.count);
    const fycShortToGate = Math.max(0, 12500 - curQResult.fyc);
    const nextTier = QUARTERLY_TIERS.find(t=>t.min > curQResult.fyc);
    let increase = 0;
    if (nextTier){
      const previewReward = (nextTier.min * nextTier.pct)/100;
      increase = previewReward - bReward;
    }
    qBonusOverview = { q: curQ, bQualifies, bReward, bPct, casesShortToGate, fycShortToGate, projectedRewardAtCurrentFyc, nextTier, increase, curFyc: curQResult.fyc };
  }
  const annualCasesShortToGate = Math.max(0, ANNUAL_BONUS_GATE_CASES - annualCases);
  const annualFycShortToGate = Math.max(0, ANNUAL_BONUS_GATE_FYC - annualFYC);
  const annualNextTierRange = ANNUAL_TIER_RANGES.find(t => t.min > annualFYC);
  let annualIncrease = 0, annualNextPct = 0;
  if (annualNextTierRange){
    const idx = ANNUAL_TIER_RANGES.indexOf(annualNextTierRange);
    annualNextPct = ANNUAL_BANDS[annualBand].pct[idx];
    const previewGross = (annualNextTierRange.min * annualNextPct)/100;
    const previewNet = Math.max(0, previewGross - totalQuarterlyBonus);
    annualIncrease = previewNet - annualBonusNet;
  }
  const qualShortfalls = qResults.filter(r=>!r.qualifies && isCurrentYear && r.q===currentActual.quarter).map(r=>({
    q: r.q, casesShort: Math.max(0,QUALIFY_MIN_CASES-r.count), fycShort: Math.max(0,QUALIFY_MIN_FYC-r.fyc), monthsShort: Math.max(0,QUALIFY_MIN_ACTIVE_MONTHS-r.activeMonths),
    count: r.count, fyc: r.fyc, activeMonths: r.activeMonths
  }));

  const compProjCard = (()=>{
    const ag = agent(); const pend = (ag.entries||[]).filter(e=>e.pending && isOrigin(e));
    if (!pend.length) return '';
    const diffs = compProjDiff(ag); const pf = pend.reduce((sum,e)=>sum+e.fyc,0);
    return `<div class="card proj-card"><h3>⏳ ถ้างานรอพิจารณาผ่านทั้งหมด</h3>
      <p class="sub">รออนุมัติ ${pend.length} ราย · FYC ${THB(pf)} — ตัวเลขหลักในหน้านี้ใช้ยอดที่อนุมัติแล้วเท่านั้น</p>
      ${diffs.length ? diffs.map(d=>`<div class="proj-item"><b style="color:var(--navy);">${d.title}</b>
        <div>✅ อนุมัติแล้ว: ${d.a?d.a.text:'ยังไม่มีผลงาน'}</div>
        <div style="color:#8A4B00;">⏳ ถ้าอนุมัติครบ: ${d.p.ok && !(d.a&&d.a.ok)?'<b style="color:var(--good);">ผ่าน</b> · ':''}${d.p.text}</div></div>`).join('')
        : '<div class="ask-empty">ถึงอนุมัติครบ ผลการแข่งขันก็ยังไม่เปลี่ยน</div>'}
    </div>`;
  })();
  const hideJoining = !!startDate && joiningMonths.length && !joiningMonths.some(j=>j.y===selYear);
  return `
    ${compProjCard}
    <div class="card dark">
      <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:10px;">

          <div class="line" style="color:var(--good);font-weight:700;margin-top:2px;padding-top:4px;border-top:1px dashed #C69A3B55;">ถ้าครบเกณฑ์ จะได้สูงสุด ${THB(joiningNextTier.bonus)}</div>
        </div>`:`<div class="alert-box" style="background:#F1F8F3;border-color:var(--good);margin-top:10px;"><div class="line" style="color:var(--good);font-weight:700;">ถึงขั้นสูงสุดแล้ว (${THB(JOINING_BONUS_CAP)})</div></div>`}
      `}
    </div>
    <div class="foot-note">* ประมาณการจากข้อมูลที่บันทึกเองเท่านั้น รางวัลจริงต้องเป็นไปตามการตรวจสอบและอนุมัติของบริษัท และเป็นรายได้ที่ต้องเสียภาษีตามกฎหมาย</div>
  `;
}

/* ================= EVENTS ================= */
function bindEvents(){
  document.querySelectorAll("[data-tab]").forEach(btn=>{
    btn.onclick = ()=>{ activeTab = btn.dataset.tab; closeAllCalendars(); render(); };
  });
  document.querySelectorAll("[data-section]").forEach(btn=>{
    btn.onclick = ()=>{ activeSection = btn.dataset.section; closeAllCalendars(); render(); };
  });
  const ys = document.getElementById("year-select");
  if (ys) ys.onchange = ()=>{
    selYear = Number(ys.value);
    // ปีเปลี่ยน เป้าหมายต้องรีเฟรชตามปีใหม่ทันที ไม่ให้ค้างค่าของปีก่อนหน้า
    umGoalsFycInput = formatThousands(String(getUmTargetFYC()));
    umAnnualGoalsFycInput = formatThousands(String(getUmAnnualTargetFYC()));
    goalsFycInput = formatThousands(String(getAgentTargetFYC()));
    annualGoalsFycInput = formatThousands(String(getAgentAnnualTargetFYC()));
    render();
  };

  // Agent picker
  const agentSelect = document.getElementById("agent-select");
  if (agentSelect) agentSelect.onchange = ()=>{ state.currentAgent = agentSelect.value; syncAgentFormState(); saveState(); render(); };


  // ----- ถาม-ตอบ -----
  const askInput = document.getElementById("ask-input");
  const runAsk = (text)=>{ askQuery = text; askResult = text.trim() ? answerQuestion(text) : ""; render(); const el=document.querySelector(".ask-card"); if (el) el.scrollIntoView({block:"start"}); };
  if (askInput){
    askInput.oninput = (e)=>{ askQuery = e.target.value; };
    askInput.onkeydown = (e)=>{ if (e.key==="Enter"){ e.preventDefault(); runAsk(askInput.value); } };
  }
  const askGo = document.getElementById("ask-go"); if (askGo) askGo.onclick = ()=>runAsk(askInput ? askInput.value : askQuery);
  const askClear = document.getElementById("ask-clear"); if (askClear) askClear.onclick = ()=>{ askResult = ""; askQuery = ""; render(); };
  document.querySelectorAll("[data-ask]").forEach(el=>{ el.onclick = ()=>runAsk(el.dataset.ask); });
  // ----- Fast / Growth -----
  const progKey = v=>decodeURIComponent(v);
  document.querySelectorAll("[data-prog-type]").forEach(el=>{
    el.onchange = ()=>{
      const st = progStOf(progKey(el.dataset.progType)); if (!st) return;
      const pg = progOf(st);
      if (el.value!=="none"){
        const nm = el.value==="fast" ? "Fast Achievement Bonus (ถึงปี 2571)" : "x2 Growth Bonus (วัดผลปี 2569)";
        if (!confirm(`เลือก ${nm}\nเข้าร่วมได้โครงการเดียว และจะล็อกไว้จนจบโครงการ ยืนยันไหม?`)){ render(); return; }
        pg.locked = true;
      }
      pg.type = el.value; saveState(); render();
    };
  });
  document.querySelectorAll("[data-prog-unlock]").forEach(el=>{
    el.onclick = ()=>{ const st = progStOf(progKey(el.dataset.progUnlock)); if (!st) return; if (!confirm("ปลดล็อกเพื่อเปลี่ยนโครงการ? (ปกติต้องอยู่โครงการเดิมจนจบ)")) return; progOf(st).locked = false; saveState(); render(); };
  });
  document.querySelectorAll("[data-prog-pos]").forEach(el=>{
    el.onchange = ()=>{ const [k,yy] = el.dataset.progPos.split("|"); const st = progStOf(progKey(k)); if (!st) return; progOf(st).fast.positions[yy] = el.value; saveState(); render(); };
  });
  document.querySelectorAll("[data-prog-na]").forEach(el=>{
    el.onclick = ()=>{ const [k,yy,v] = el.dataset.progNa.split("|"); const st = progStOf(progKey(k)); if (!st) return; const f = progOf(st).fast; if (!f.newAgentsManual) f.newAgentsManual = {}; if (v==='') delete f.newAgentsManual[yy]; else f.newAgentsManual[yy] = Number(v); saveState(); render(); };
  });
  document.querySelectorAll("[data-prog-pass]").forEach(el=>{
    el.onchange = ()=>{ const [k,yy] = el.dataset.progPass.split("|"); const st = progStOf(progKey(k)); if (!st) return; progOf(st).fast.passed[yy] = el.checked; saveState(); render(); };
  });
  document.querySelectorAll("[data-prog-gnew]").forEach(el=>{
    el.onchange = ()=>{ const st = progStOf(progKey(el.dataset.progGnew)); if (!st) return; progOf(st).growth.newIn2567 = el.checked; saveState(); render(); };
  });
  document.querySelectorAll("[data-prog-gpos]").forEach(el=>{
    el.onchange = ()=>{ const st = progStOf(progKey(el.dataset.progGpos)); if (!st) return; progOf(st).growth.basePos = el.value; saveState(); render(); };
  });
  document.querySelectorAll("[data-prog-gperf]").forEach(el=>{
    el.onfocus = (e)=>e.target.select();
    el.oninput = (e)=>{ e.target.value = formatThousands(stripCommas(e.target.value)); };
    el.onblur = (e)=>{ const st = progStOf(progKey(el.dataset.progGperf)); if (!st) return; const v = Number(stripCommas(e.target.value))||0; const g = progOf(st).growth; if (g.basePerf!==v){ g.basePerf = v; saveState(); render(); } };
  });
  document.querySelectorAll("[data-pending-reason]").forEach(el=>{
    el.onchange = ()=>{
      const [n,id] = el.dataset.pendingReason.split("|").map(decodeURIComponent);
      const ag = state.agents[n]; const e = ag && ag.entries.find(x=>String(x.id)===id);
      if (e){ e.pendingReason = el.value; saveState(); }
    };
  });
  document.querySelectorAll("[data-coach-open]").forEach(el=>{
    el.onclick = ()=>{ const n = el.dataset.coachOpen; openCoachAgent = openCoachAgent===n ? null : n; coachDraft = { date: todayIso(), note: "", followUp: "" }; render(); };
  });
  const coachNote = document.getElementById("coach-note");
  if (coachNote) coachNote.oninput = (e)=>{ coachDraft.note = e.target.value; };
  document.querySelectorAll("[data-coach-save]").forEach(el=>{
    el.onclick = ()=>{
      const ag = state.agents[el.dataset.coachSave]; if (!ag) return;
      if (!coachDraft.note.trim()){ showToast("พิมพ์บันทึกก่อน"); return; }
      if (!ag.coaching) ag.coaching = [];
      ag.coaching.push({ date: coachDraft.date || todayIso(), note: coachDraft.note.trim(), followUp: coachDraft.followUp || "" });
      coachDraft = { date: todayIso(), note: "", followUp: "" };
      saveState(); render();
    };
  });
  document.querySelectorAll("[data-ev-name]").forEach(el=>{
    el.onfocus = (e)=>e.target.select();
    el.onchange = ()=>{ const ev=evAll()[Number(el.dataset.evName)]; if (!ev) return; ev.name = el.value.trim()||'การแข่งขัน'; saveState(); render(); };
  });
  document.querySelectorAll("[data-ev-tiers]").forEach(el=>{
    el.onfocus = (e)=>e.target.select();
    el.onchange = ()=>{ const ev=evAll()[Number(el.dataset.evTiers)]; if (!ev) return; ev.tiers = (el.value.match(/\d{1,3}(?:,\d{3})+(?:\.\d+)?|\d+(?:\.\d+)?/g)||[]).map(x=>Number(x.replace(/,/g,''))).filter(x=>x>0).sort((a,b)=>a-b); saveState(); render(); };
  });
  document.querySelectorAll("[data-ev-del]").forEach(el=>{
    el.onclick = ()=>{ const i=Number(el.dataset.evDel), arr=evAll(); if (!arr[i] || !confirm(`ลบการแข่งขัน "${arr[i].name}" ใช่ไหม?`)) return; arr.splice(i,1); saveState(); render(); };
  });
  const evAdd = document.getElementById("ev-add");
  if (evAdd) evAdd.onclick = ()=>{ const t=todayIso(); evAll().push({ key:'ev_'+Date.now(), name:'การแข่งขันใหม่', start:t, end:t, tiers:[] }); saveState(); render(); };
  document.querySelectorAll("[data-coach-done]").forEach(el=>{
    el.onchange = ()=>{
      const [n,i] = el.dataset.coachDone.split("|"); const ag = state.agents[decodeURIComponent(n)];
      if (!ag || !ag.coaching || !ag.coaching[Number(i)]) return;
      ag.coaching[Number(i)].done = el.checked; saveState(); render();
    };
  });
  document.querySelectorAll("[data-coach-del]").forEach(el=>{
    el.onclick = ()=>{
      const [n,i] = el.dataset.coachDel.split("|"); const ag = state.agents[decodeURIComponent(n)];
      if (!ag || !ag.coaching || !confirm("ลบบันทึกนี้ใช่ไหม?")) return;
      ag.coaching.splice(Number(i),1); saveState(); render();
    };
  });
  const recName = document.getElementById("recruit-name"), recPhone = document.getElementById("recruit-phone");
  if (recName) recName.oninput = (e)=>{ recruitDraft.name = e.target.value; };
  if (recPhone) recPhone.oninput = (e)=>{ recruitDraft.phone = e.target.value; };
  const recAdd = document.getElementById("recruit-add");
  if (recAdd) recAdd.onclick = ()=>{
    const name = recruitDraft.name.trim(); if (!name){ showToast("กรอกชื่อผู้สนใจก่อน"); return; }
    if (!state.recruits) state.recruits = [];
    state.recruits.push({ id: "r"+Date.now(), name, phone: recruitDraft.phone.trim(), stage: "สนใจ", nextDate: "", note: "", cardDate: "", createdAt: todayIso() });
    recruitDraft = { name: "", phone: "" }; saveState(); render();
  };
  const findRecruit = id=>(state.recruits||[]).find(r=>r.id===id);
  document.querySelectorAll("[data-recruit-stage]").forEach(el=>{ el.onchange = ()=>{ const r = findRecruit(el.dataset.recruitStage); if (r){ r.stage = el.value; saveState(); render(); } }; });
  document.querySelectorAll("[data-recruit-note]").forEach(el=>{ el.onblur = ()=>{ const r = findRecruit(el.dataset.recruitNote); if (r && r.note!==el.value){ r.note = el.value; saveState(); } }; });
  document.querySelectorAll("[data-recruit-del]").forEach(el=>{ el.onclick = ()=>{ const r = findRecruit(el.dataset.recruitDel); if (!r || !confirm(`ลบ "${r.name}" ออกจากรายชื่อว่าที่ตัวแทนใช่ไหม?`)) return; state.recruits = state.recruits.filter(x=>x!==r); saveState(); render(); }; });
  document.querySelectorAll("[data-recruit-join]").forEach(el=>{
    el.onclick = ()=>{
      const r = findRecruit(el.dataset.recruitJoin); if (!r) return;
      if (state.agents[r.name]){ showToast("มีตัวแทนชื่อนี้อยู่แล้ว"); return; }
      const ag = JSON.parse(JSON.stringify(DEFAULT_AGENT_DATA));
      if (!ag.license) ag.license = { cardIssueDate: "", cardExpiryDate: "", cardNumber: "", agentCode: "", trainings: [] };
      ag.license.cardIssueDate = r.cardDate || "";
      state.agents[r.name] = ag; r.stage = "เข้าทีมแล้ว";
      saveState(); render(); showToast(`เพิ่ม ${r.name} เข้าทีมแล้ว`);
    };
  });
  document.querySelectorAll("[data-tier-toggle]").forEach(el=>{
    el.onclick = (ev)=>{ ev.stopPropagation(); const k=el.dataset.tierToggle; openTiers[k]=!openTiers[k]; render(); };
  });
  document.querySelectorAll("[data-growth-whatif]").forEach(inp=>{
    inp.onfocus = (e)=>e.target.select();
    inp.oninput = ()=>{
      const k = inp.dataset.growthWhatif;
      const f = formatThousands(inp.value); if (f!==inp.value) inp.value = f;
      growthWhatIf[k] = inp.value;
      const out = document.querySelector(`[data-growth-whatif-out="${CSS.escape(k)}"]`);
      if (out) out.innerHTML = growthWhatIfText(Number(inp.dataset.base)||0, Number(inp.dataset.cfyc)||0, inp.value);
    };
  });
  document.querySelectorAll("[data-toggle-box]").forEach(el=>{
    el.onclick = ()=>{
      const key = el.dataset.toggleBox;
      collapsedBoxes[key] = !collapsedBoxes[key];
      render();
    };
  });
  document.querySelectorAll("[data-open-team-um]").forEach(el=>{
    el.onclick = ()=>{
      const name = el.dataset.openTeamUm;
      if (!state.teamUMs[name]) return;
      mainAppState = state;
      // ครั้งแรกที่เข้า ให้สร้างโครงสร้างข้อมูลเต็มแบบเดียวกับแอปหลัก (ทีมตัวแทน + เป้าหมาย UM ของตัวเอง) ถ้ายังไม่มี
      if (!mainAppState.teamUMs[name].agents){
        mainAppState.teamUMs[name] = {
          agents: { "ตัวแทนคนที่ 1": JSON.parse(JSON.stringify(DEFAULT_AGENT_DATA)) },
          currentAgent: "ตัวแทนคนที่ 1",
          umGoal: { targetFYC: 0, startMonth: 0, endMonth: 11, position: "", compareA: "", compareB: "", monthOverrides: {}, directOverrides: {}, newAgentPremiums: {}, viewAsOfMonth: null },
        };
      }
      state = mainAppState.teamUMs[name];
      if (!state.umGoal) state.umGoal = {};
      state.umGoal = Object.assign({ targetFYC: 0, startMonth: 0, endMonth: 11, position: "", compareA: "", compareB: "", monthOverrides: {}, directOverrides: {}, newAgentPremiums: {}, viewAsOfMonth: null }, state.umGoal);
      if (!state.agents || !Object.keys(state.agents).length) state.agents = { "ตัวแทนคนที่ 1": JSON.parse(JSON.stringify(DEFAULT_AGENT_DATA)) };
      if (!state.agents[state.currentAgent]) state.currentAgent = Object.keys(state.agents)[0];
      activeTeamUmName = name;
      window.scrollTo(0,0);
      activeSection = "um";
      syncAgentFormState();
      umGoalsFycInput = formatThousands(String(getUmTargetFYC()));
      umAnnualGoalsFycInput = formatThousands(String(getUmAnnualTargetFYC()));
      render();
    };
  });
  const btnExitTeamUmContext = document.getElementById("btn-exit-team-um-context");
  if (btnExitTeamUmContext) btnExitTeamUmContext.onclick = ()=>{
    mainAppState.teamUMs[activeTeamUmName] = state;
    state = mainAppState;
    activeTeamUmName = null;
    activeSection = "teamUm";
    window.scrollTo(0,0);
    syncAgentFormState();
    umGoalsFycInput = formatThousands(String(getUmTargetFYC()));
    umAnnualGoalsFycInput = formatThousands(String(getUmAnnualTargetFYC()));
    saveState(); render();
  };
  const btnToggleAddTeamUm = document.getElementById("btn-toggle-add-team-um");
  if (btnToggleAddTeamUm) btnToggleAddTeamUm.onclick = ()=>{ addTeamUmMode = true; newTeamUmNameInput=""; render(); };
  const btnCancelAddTeamUm = document.getElementById("btn-cancel-add-team-um");
  if (btnCancelAddTeamUm) btnCancelAddTeamUm.onclick = ()=>{ addTeamUmMode = false; render(); };
  const newTeamUmNameEl = document.getElementById("new-team-um-name");
  if (newTeamUmNameEl){
    newTeamUmNameEl.oninput = (e)=>{ newTeamUmNameInput = e.target.value; };
    newTeamUmNameEl.onfocus = (e)=>e.target.select();
    newTeamUmNameEl.onkeydown = (e)=>{ if (e.key==="Enter"){ e.preventDefault(); document.getElementById("btn-confirm-add-team-um")?.click(); } };
  }
  const btnConfirmAddTeamUm = document.getElementById("btn-confirm-add-team-um");
  if (btnConfirmAddTeamUm) btnConfirmAddTeamUm.onclick = ()=>{
    const name = newTeamUmNameInput.trim();
    if (!name){ showToast("กรุณากรอกชื่อ UM"); return; }
    if (state.teamUMs[name]){ showToast("มีชื่อนี้อยู่แล้ว"); return; }
    state.teamUMs[name] = {
      agents: { "ตัวแทนคนที่ 1": JSON.parse(JSON.stringify(DEFAULT_AGENT_DATA)) },
      currentAgent: "ตัวแทนคนที่ 1",
      umGoal: { targetFYC: 0, startMonth: 0, endMonth: 11, position: "", compareA: "", compareB: "", monthOverrides: {}, directOverrides: {}, newAgentPremiums: {}, viewAsOfMonth: null },
    };
    addTeamUmMode = false;
    saveState(); render();
  };
  document.querySelectorAll("[data-rename-team-um]").forEach(btn=>{
    btn.onclick = (ev)=>{
      ev.stopPropagation(); // กันไม่ให้คลิกทะลุไปเปิดหน้า UM (เดิมทำให้ error/ค้าง)
      const oldName = btn.dataset.renameTeamUm;
      const newName = window.prompt("เปลี่ยนชื่อ UM:", oldName);
      if (!newName || !newName.trim() || newName.trim()===oldName) return;
      const trimmed = newName.trim();
      if (state.teamUMs[trimmed]){ showToast("มีชื่อนี้อยู่แล้ว"); return; }
      state.teamUMs[trimmed] = state.teamUMs[oldName];
      delete state.teamUMs[oldName];
      saveState(); render();
    };
  });
  document.querySelectorAll("[data-delete-team-um]").forEach(btn=>{
    btn.onclick = (ev)=>{
      ev.stopPropagation();
      const name = btn.dataset.deleteTeamUm;
      if (!window.confirm(`ลบข้อมูลทีมทั้งหมดของ "${name}" ใช่หรือไม่? การลบนี้ย้อนกลับไม่ได้`)) return;
      delete state.teamUMs[name];
      saveState(); render();
    };
  });
  document.querySelectorAll("[data-rename-agent]").forEach(btn=>{
    btn.onclick = ()=>{
      const oldName = btn.dataset.renameAgent;
      const newName = window.prompt("เปลี่ยนชื่อตัวแทน:", oldName);
      if (!newName || !newName.trim() || newName.trim()===oldName) return;
      const trimmed = newName.trim();
      if (state.agents[trimmed]){ showToast("มีชื่อนี้อยู่แล้ว"); return; }
      state.agents[trimmed] = state.agents[oldName];
      delete state.agents[oldName];
      // ย้ายเบี้ยประกันที่คีย์ไว้ (UM) ตามชื่อใหม่ด้วย ไม่งั้นจะกลายเป็นข้อมูลกำพร้าค้างอยู่ใต้ชื่อเก่า หาไม่เจออีกต่อไป
      if (state.umGoal?.newAgentPremiums?.[oldName]){
        if (!state.umGoal.newAgentPremiums[trimmed]){
          state.umGoal.newAgentPremiums[trimmed] = state.umGoal.newAgentPremiums[oldName];
        }
        delete state.umGoal.newAgentPremiums[oldName];
      }
      if (state.currentAgent===oldName) state.currentAgent = trimmed;
      saveState(); render();
    };
  });
  document.querySelectorAll("[data-delete-agent]").forEach(btn=>{
    btn.onclick = ()=>{
      const name = btn.dataset.deleteAgent;
      if (!window.confirm(`ลบข้อมูลทั้งหมดของ "${name}" ใช่หรือไม่? การลบนี้ย้อนกลับไม่ได้`)) return;
      delete state.agents[name];
      if (state.umGoal?.newAgentPremiums?.[name]) delete state.umGoal.newAgentPremiums[name];
      if (state.currentAgent===name){
        const remaining = Object.keys(state.agents);
        state.currentAgent = remaining[0];
        syncAgentFormState();
      }
      saveState(); render();
    };
  });
  const btnToggleAddAgent = document.getElementById("btn-toggle-add-agent");
  if (btnToggleAddAgent) btnToggleAddAgent.onclick = ()=>{ addAgentMode = true; newAgentNameInput=""; render(); };
  const btnCancelAddAgent = document.getElementById("btn-cancel-add-agent");
  if (btnCancelAddAgent) btnCancelAddAgent.onclick = ()=>{ addAgentMode = false; render(); };
  const newAgentNameEl = document.getElementById("new-agent-name");
  if (newAgentNameEl){
    newAgentNameEl.oninput = (e)=>{ newAgentNameInput = e.target.value; };
    newAgentNameEl.onfocus = (e)=>e.target.select();
    newAgentNameEl.onkeydown = (e)=>{ if (e.key==="Enter"){ e.preventDefault(); confirmAddAgent(); } };
  }
  const btnConfirmAddAgent = document.getElementById("btn-confirm-add-agent");
  if (btnConfirmAddAgent) btnConfirmAddAgent.onclick = confirmAddAgent;

  // Goals tab
  const goalInput = document.getElementById("goal-fyc-input");
  if (goalInput){
    goalInput.oninput = (e)=>{ goalsFycInput = formatThousands(stripCommas(e.target.value)); e.target.value = goalsFycInput; };
    goalInput.onfocus = (e)=>e.target.select();
    goalInput.onblur = ()=>{
      const raw = Number(stripCommas(goalsFycInput));
      if (!isNaN(raw) && raw>=0){ setAgentTargetFYC(raw); saveState(); }
      render();
    };
    goalInput.onkeydown = (e)=>{ if (e.key==="Enter"){ e.preventDefault(); e.target.blur(); } };
  }
  // ข้อมูลบัตรตัวแทนและการอบรม — วันที่ 2 ช่องนี้ใช้ปฏิทินกำหนดเองของแอป (ผูกผ่าน data-toggle-cal/data-pick-day ที่อื่นแล้ว) จึงเหลือแค่ช่องข้อความ
  document.querySelectorAll("[data-switch-agent-comp]").forEach(el=>{
    el.onclick = ()=>{ const n=el.dataset.switchAgentComp; if(!state.agents[n]) return; state.currentAgent=n; syncAgentFormState(); activeSection="agent"; activeTab="competitions"; saveState(); window.scrollTo(0,0); render(); };
  });
  document.querySelectorAll("[data-edit-license]").forEach(btn=>{
    btn.onclick = (ev)=>{ ev.stopPropagation(); const n=btn.dataset.editLicense; editLicenseAgent = (editLicenseAgent===n)?null:n; if (editLicenseAgent && state.agents[n]){ state.currentAgent = n; syncAgentFormState(); trainingSectionOpen = true; saveState(); } closeAllCalendars(); render(); };

        render();

          ()=>{ checkClearRelatedFields(targetAgentName); saveState(); render(); },
          ()=>{ const arr = state.agents[targetAgentName].entries; removed.forEach(r=>arr.splice(r.i,0,r.e)); }
        );
      } else if (hasSiblings) {
        // ลบงวดกลาง/งวดท้าย — ลบงวดนี้พร้อมงวดถัดๆ ไปทั้งหมดในกรมธรรม์เดียวกัน (งวดก่อนหน้ายังอยู่เหมือนเดิม)
        const targetIndex = target.installmentIndex ?? 0;
        const removed = entriesArr
          .map((e,i)=>({e,i}))
          .filter(x=>x.e.policyId===target.policyId && (x.e.installmentIndex ?? 0)>=targetIndex);
        state.agents[targetAgentName].entries = entriesArr.filter(e=>!(e.policyId===target.policyId && (e.installmentIndex ?? 0)>=targetIndex));
        render();
        showUndoToast(`ลบงวดที่ ${targetIndex+1} เป็นต้นไป (${removed.length} งวด) แล้ว`,
          ()=>{ checkClearRelatedFields(targetAgentName); saveState(); render(); },
          ()=>{ const arr = state.agents[targetAgentName].entries; removed.forEach(r=>arr.splice(r.i,0,r.e)); }
        );
      } else {
        const idx = entriesArr.indexOf(target);
        state.agents[targetAgentName].entries = entriesArr.filter(e=>e.id!==id);
        render();
        showUndoToast(`ลบรายการวันที่ ${target.date} จำนวน ${THB(target.fyc)} แล้ว`,
          ()=>{ checkClearRelatedFields(targetAgentName); saveState(); render(); },
          ()=>{ state.agents[targetAgentName].entries.splice(idx,0,target); }
        );
      }
    };
  });

  const btnBackupNow = document.getElementById("btn-backup-now");
  if (btnBackupNow) btnBackupNow.onclick = ()=>document.getElementById("btn-export-header").click();
  const btnBackupLater = document.getElementById("btn-backup-later");
  if (btnBackupLater) btnBackupLater.onclick = ()=>{ backupReminderSnoozed = true; render(); };
  const exportBtn = document.getElementById("btn-export-header");
  if (exportBtn) exportBtn.onclick = ()=>{
    // ถ้ากำลังดู UM คนอื่นอยู่ ต้องแบ็กอัพก้อนข้อมูลหลักทั้งหมด (ของพี่เอง + ทุก UM) ไม่ใช่แค่ของ UM คนนั้น
    if (activeTeamUmName && mainAppState) mainAppState.teamUMs[activeTeamUmName] = state;
    const full = (activeTeamUmName && mainAppState) ? mainAppState : state;
    const blob = new Blob([JSON.stringify(full)],{type:"application/json"});
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href=url; a.download=`${IS_AGENT_APP?'agent':'ped-dashboard'}-backup-${todayIso()}.json`;
    a.click(); setTimeout(()=>URL.revokeObjectURL(url), 1000);
    setMeta("lastBackupAt", new Date().toISOString());
    showToast("ดาวน์โหลดไฟล์แบ็กอัพแล้ว — อย่าลืมเก็บไว้ใน Drive/LINE Keep");
    render();
  };
  const importBtn = document.getElementById("btn-import-header");
  const fileInput = document.getElementById("file-import-header");
  if (importBtn && fileInput){
    importBtn.onclick = ()=>{
      if (activeTeamUmName){ showToast("กรุณากด ← กลับของฉันเอง ก่อนโหลดไฟล์แบ็กอัพ"); return; }
      const hasExistingData = Object.values(state.agents).some(ag=>ag.entries.length>0);
      if (hasExistingData){
        const ok = confirm("การนำเข้าไฟล์จะทับข้อมูลปัจจุบันทั้งหมด (ของทุกตัวแทน) ย้อนกลับไม่ได้ นอกจากมีไฟล์แบ็กอัพเก่าเก็บไว้ ต้องการดำเนินการต่อไหม?");
        if (!ok) return;
      }
      fileInput.click();
    };
    fileInput.onchange = (e)=>{
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = ()=>{
        try{
          const imported = JSON.parse(reader.result);
          state = normalizeState(imported);
          syncAgentFormState();
          saveState(); render();
          // เช็คว่ามีรายการ FYC ผิดปกติ (0 หรือติดลบ) หลุดมาจากไฟล์ไหม — ปกติแล้วกรอกผ่านฟอร์มจะกันไว้แล้ว แต่ไฟล์ภายนอกอาจมีข้อมูลแบบนี้ปนมาได้
          const badEntries = [];
          Object.entries(state.agents).forEach(([name, ag])=>{
            ag.entries.forEach(en=>{ if ((en.fyc??0)<=0) badEntries.push({ name, date: en.date, fyc: en.fyc }); });
          });
          if (badEntries.length){
            showToast(`นำเข้าสำเร็จ — แต่พบ ${badEntries.length} รายการที่ FYC เป็น 0 หรือติดลบ ควรตรวจสอบ`);
          } else {
            showToast("นำเข้าข้อมูลสำเร็จ");
          }
        }catch(err){ showToast("ไฟล์ไม่ถูกต้อง นำเข้าไม่สำเร็จ"); }
      };
      reader.readAsText(file);
      fileInput.value = "";
    };
  }

  // Competitions tab
  const printReportBtn = document.getElementById("btn-print-report");
  if (printReportBtn) printReportBtn.onclick = generatePrintReport;
  document.querySelectorAll("[data-persist-band]").forEach(sel=>{
    sel.onchange = ()=>{
      agent().persistQuarterly[sel.dataset.persistBand] = Number(sel.value);
      saveState(); render();
    };
  });
  const item3HypInput = document.getElementById("item3-hypothetical-input");
  if (item3HypInput){
    const resultEl = document.getElementById("item3-hypothetical-result");
    const recompute = ()=>{
      const raw = Number(stripCommas(item3HypInput.value)) || 0;
      const curCfyc = Number(item3HypInput.dataset.currentCfyc);
      const quota3v = Number(item3HypInput.dataset.quota3);
      const posValue = item3HypInput.dataset.position;
      const interimPaid = Number(item3HypInput.dataset.interimPaid) || 0;
      const table = NEW_AGENT_PROFIT_TABLE[posValue];
      if (raw<=0){ resultEl.innerHTML = ''; return; }
      const hypTotal = curCfyc + raw;
      const hypExcess = Math.max(0, hypTotal - quota3v);
      const hypPct = quota3v>0 ? (hypExcess/quota3v)*100 : 0;
      const hypBandIdx = hypExcess>0 ? newAgentProfitBandIndex(hypPct) : -1;
      if (hypBandIdx<0){
        resultEl.innerHTML = `<div style="color:var(--bad);">ถ้าเพิ่ม ${formatThousands(String(raw))} (รวมเป็น ${formatThousands(String(hypTotal))}) ยังไม่เกินโควตา ${formatThousands(String(quota3v))} จึงยังไม่ได้โบนัสข้อนี้</div>`;
        return;
      }
      const hypRate = table.rates[hypBandIdx];
      const hypFlat = table.amounts ? table.amounts[hypBandIdx] : 0;
      const hypBonusGross = (hypExcess*hypRate/100) + hypFlat;
      // หักงวดแรก (มิถุนา) ที่ได้รับไปแล้วออก ไม่งั้นตัวเลขจะสูงเกินจริง (นับซ้ำกับที่จ่ายไปแล้ว)
      const hypBonusNet = Math.max(0, hypBonusGross - interimPaid);
      const nextIdx = hypBandIdx+1;
      let nextNote = 'อยู่ขั้นสูงสุดแล้ว';
      if (nextIdx < NEW_AGENT_PROFIT_BAND_MIN_PCT.length){
        const nextMinPct = NEW_AGENT_PROFIT_BAND_MIN_PCT[nextIdx];
        const nextExcessNeeded = (nextMinPct/100)*quota3v;
        const shortfall = Math.max(0, nextExcessNeeded - hypExcess);
        const nextRate = table.rates[nextIdx];
        const nextFlat = table.amounts ? table.amounts[nextIdx] : 0;
        const nextBonusGross = (nextExcessNeeded*nextRate/100) + nextFlat;
        const nextBonusNet = Math.max(0, nextBonusGross - interimPaid);
        nextNote = `ขาดอีก ${formatThousands(String(Math.round(shortfall)))} จะขยับเป็นอัตรา ${nextRate}% (ได้เพิ่มเป็น ${formatThousands(String(Math.round(nextBonusNet)))} สุทธิ)`;
      }
      const interimLine = interimPaid>0 ? `<div style="color:var(--muted);margin-top:2px;">ได้รับงวดแรก (มิถุนา) ไปแล้ว ${formatThousands(String(Math.round(interimPaid)))} → จะได้รับจริงเพิ่มอีก <b style="color:var(--good);">${formatThousands(String(Math.round(hypBonusNet)))}</b></div>` : '';
      resultEl.innerHTML = `<div style="color:var(--navy);">ถ้าเพิ่ม ${formatThousands(String(raw))} (รวมเป็น ${formatThousands(String(hypTotal))}) → โบนัสรวมทั้งปีประมาณ <b style="color:var(--good);">${formatThousands(String(Math.round(hypBonusGross)))}</b> (อัตรา ${hypRate}%)</div>${interimLine}<div style="color:var(--gold);font-weight:600;margin-top:2px;">🎯 ${nextNote}</div>`;
    };
    item3HypInput.oninput = (e)=>{ e.target.value = formatThousands(stripCommas(e.target.value)); recompute(); };
    item3HypInput.onfocus = (e)=>e.target.select();
  }
  const combinedHypInput = document.getElementById("combined-hypothetical-input");
  if (combinedHypInput){
    const resultEl = document.getElementById("combined-hypothetical-result");
    const recompute = ()=>{
      const raw = Number(stripCommas(combinedHypInput.value)) || 0;
      if (raw<=0){ resultEl.innerHTML = ''; return; }
      const curCfyc = Number(combinedHypInput.dataset.currentCfyc);
      const quota3v = Number(combinedHypInput.dataset.quota3);
      const posValue = combinedHypInput.dataset.position;
      const interimPaid = Number(combinedHypInput.dataset.interimPaid) || 0;
      const tenurePct = Number(combinedHypInput.dataset.tenurePct);
      const curQDirect = Number(combinedHypInput.dataset.curQDirect);
      const threshold = Number(combinedHypInput.dataset.threshold);
      const table = NEW_AGENT_PROFIT_TABLE[posValue];

      // ข้อ 2: ค่าขยายงาน — สัดส่วนตรงตัวจาก CFYC ที่เพิ่ม
      const item2Impact = raw * tenurePct / 100;

      // ข้อ 3: โบนัสส่วนเกินโควตา — เทียบก่อน/หลังเพิ่ม
      const curExcess = Math.max(0, curCfyc - quota3v);
      const curPct = quota3v>0 ? (curExcess/quota3v)*100 : 0;
      const curBandIdx = curExcess>0 ? newAgentProfitBandIndex(curPct) : -1;
      const curBonus = curBandIdx>=0 ? (curExcess*table.rates[curBandIdx]/100) + (table.amounts?table.amounts[curBandIdx]:0) : 0;
      const hypTotal = curCfyc + raw;
      const hypExcess = Math.max(0, hypTotal - quota3v);
      const hypPct = quota3v>0 ? (hypExcess/quota3v)*100 : 0;
      const hypBandIdx = hypExcess>0 ? newAgentProfitBandIndex(hypPct) : -1;
      const hypBonus = hypBandIdx>=0 ? (hypExcess*table.rates[hypBandIdx]/100) + (table.amounts?table.amounts[hypBandIdx]:0) : 0;
      const item3Impact = Math.max(0, hypBonus - curBonus);

      // ข้อ 6 (DPO): สมมติว่ายอดที่เพิ่มขึ้นนับเป็นตัวแทนตรงของไตรมาสนี้ด้วย เทียบอัตราก่อน/หลัง
      const curRate = salesCompRate(curQDirect, threshold);
      const hypQDirect = curQDirect + raw;
      const hypRate6 = salesCompRate(hypQDirect, threshold);
      const curReward6 = curQDirect * curRate / 100;
      const hypReward6 = hypQDirect * hypRate6 / 100;
      const item6Impact = Math.max(0, hypReward6 - curReward6);

      const totalImpact = item2Impact + item3Impact + item6Impact;
      resultEl.innerHTML = `<div style="color:var(--navy);">ถ้าทีมทำ CFYC เพิ่มอีก <b>${formatThousands(String(raw))}</b> จะได้เพิ่ม:</div>
        <div style="padding-left:10px;margin-top:2px;">
          <div>ค่าขยายงาน: <b style="color:var(--good);">${THB(item2Impact)}</b></div>
          <div>โบนัสส่วนเกินโควตา: <b style="color:var(--good);">${THB(item3Impact)}</b>${item3Impact>0 && hypBandIdx!==curBandIdx?' (ขยับขั้น)':''}</div>
          <div>DPO: <b style="color:var(--good);">${THB(item6Impact)}</b>${hypRate6!==curRate?` (อัตราขยับเป็น ${hypRate6}%)`:''}</div>
        </div>
        <div style="margin-top:4px;font-weight:700;color:var(--navy);">รวมเพิ่มขึ้นทั้งหมด: <span style="color:var(--good);font-size:17px;">${THB(totalImpact)}</span></div>
        <div style="font-size:12px;color:var(--muted);margin-top:2px;">*DPO สมมติว่ายอดที่เพิ่มนับเป็นตัวแทนตรงของไตรมาสนี้ด้วย ถ้าเป็นผลงานทีมอื่นที่ไม่ใช่ตัวแทนตรง DPO อาจไม่ได้เพิ่มตามนี้จริง</div>`;
    };
    combinedHypInput.oninput = (e)=>{ e.target.value = formatThousands(stripCommas(e.target.value)); recompute(); };
    combinedHypInput.onfocus = (e)=>e.target.select();
  }
  document.querySelectorAll("[data-fyc-override]").forEach(inp=>{
    inp.oninput = (e)=>{ const f = formatThousands(stripCommas(e.target.value)); e.target.value = f; };
    inp.onfocus = (e)=>e.target.select();
    inp.onkeydown = (e)=>{ if (e.key==="Enter"){ e.preventDefault(); e.target.blur(); } };
    inp.onblur = (e)=>{
      const key = inp.dataset.fycOverride;
      const raw = stripCommas(e.target.value.trim());
      if (!agent().competitions.monthlyFycOverride) agent().competitions.monthlyFycOverride = {};
      if (raw===""){ delete agent().competitions.monthlyFycOverride[key]; }
      else{
        const num = Number(raw);
        if (!isNaN(num) && num>=0){ agent().competitions.monthlyFycOverride[key] = num; }
      }
      saveState(); render();
    };
  });
  const annualPersistSel = document.querySelector("[data-annual-persist-band]");
  if (annualPersistSel){
    annualPersistSel.onchange = ()=>{
      agent().persistQuarterly[`annual-${selYear}`] = Number(annualPersistSel.value);
      saveState(); render();
    };
  }

  // Date pickers (delegated)
  document.querySelectorAll("[data-toggle-cal]").forEach(btn=>{
    btn.onclick = (e)=>{
      e.stopPropagation();
      const id = btn.dataset.toggleCal;
      const isoVal = getIsoForPicker(id);
      const wasOpen = calState(id).open;
      closeAllCalendars();
      if (!wasOpen){
        const cs = calState(id);
        const d = isoVal ? new Date(isoVal+"T00:00:00") : new Date();
        cs.viewYear = d.getFullYear(); cs.viewMonth = d.getMonth();
        cs.open = true;
      }
      render();
    };
  });
  document.querySelectorAll("[data-shift-month]").forEach(btn=>{
    btn.onclick = (e)=>{
      e.stopPropagation();
      const raw = btn.dataset.shiftMonth;
      const sep = raw.lastIndexOf("|");
      const id = raw.slice(0,sep), delta = raw.slice(sep+1);
      const cs = calState(id);
      let m = cs.viewMonth + Number(delta), y = cs.viewYear;
      if (m<0){m=11;y-=1;} if (m>11){m=0;y+=1;}
      cs.viewMonth=m; cs.viewYear=y;
      render();
    };
  });
  document.querySelectorAll("[data-year-select-cal]").forEach(sel=>{
    sel.onchange = (e)=>{
      e.stopPropagation();
      const id = sel.dataset.yearSelectCal;
      calState(id).viewYear = Number(sel.value);
      render();
    };
  });
  document.querySelectorAll("[data-month-select-cal]").forEach(sel=>{
    sel.onchange = (e)=>{
      e.stopPropagation();
      const id = sel.dataset.monthSelectCal;
      calState(id).viewMonth = Number(sel.value);
      render();
    };
  });
  document.querySelectorAll("[data-pick-day]").forEach(btn=>{
    btn.onclick = (e)=>{
      e.stopPropagation();
      const raw = btn.dataset.pickDay;
      const sep = raw.lastIndexOf("|");
      const id = raw.slice(0,sep), day = raw.slice(sep+1);
      const cs = calState(id);
      const iso = `${cs.viewYear}-${String(cs.viewMonth+1).padStart(2,"0")}-${String(Number(day)).padStart(2,"0")}`;
      cs.open = false;
      setIsoForPicker(id, iso);
      render();
    };
  });
  // close calendars when clicking outside any date-wrap
  document.querySelectorAll(".date-wrap").forEach(wrap=>{
    wrap.addEventListener("click", (e)=>e.stopPropagation());
  });
}

function closeAllCalendars(){
  Object.keys(calendars).forEach(id=>{ calendars[id].open=false; });
}
function closeAllCalendarsAndRender(){
  const anyOpen = Object.values(calendars).some(c=>c.open);
  if (anyOpen){ closeAllCalendars(); render(); }
}

function getIsoForPicker(id){
  if (id==="main") return entryForm.date;
  if (id==="edit") return editDraft.date;
  if (id==="joining") return agent().competitions.firstSaleDate;
  if (id==="license-issue") return agent().license.cardIssueDate;
  if (id==="license-expiry") return agent().license.cardExpiryDate;
  if (id.startsWith("mlic-exp|")){ const ag=state.agents[decodeURIComponent(id.slice(9))]; return ag&&ag.license?ag.license.cardExpiryDate:""; }
  if (id==="new-training") return newTrainingDraft.date;
  if (id.startsWith("ev-start|") || id.startsWith("ev-end|")){ const ev=evAll()[Number(id.split("|")[1])]; return ev ? (id.startsWith("ev-start|")?ev.start:ev.end)||"" : ""; }
  if (id==="coach-date") return coachDraft.date || todayIso();
  if (id==="coach-follow") return coachDraft.followUp;
  if (id.startsWith("recruit-next|") || id.startsWith("recruit-card|")){ const r=(state.recruits||[]).find(x=>x.id===id.split("|")[1]); return r ? (id.startsWith("recruit-next|") ? r.nextDate : r.cardDate) || "" : ""; }
  if (id.startsWith("premium|")){
    const parts = id.split("|"); // premium|<encodedName>|<idx>
    const name = decodeURIComponent(parts[1]);
    const idx = Number(parts[2]);
    return getNormalizedPremiums(name)[idx].date;
  }
  return "";
}
function setIsoForPicker(id, iso){
  if (id==="main") entryForm.date = iso;
  else if (id==="edit") editDraft.date = iso;
  else if (id==="joining"){ agent().competitions.firstSaleDate = iso; saveState(); }
  else if (id==="license-issue"){ agent().license.cardIssueDate = iso; saveState(); }
  else if (id==="license-expiry"){ agent().license.cardExpiryDate = iso; saveState(); }
  else if (id.startsWith("mlic-exp|")){ const ag=state.agents[decodeURIComponent(id.slice(9))]; if (ag){ if(!ag.license) ag.license={cardIssueDate:"",cardExpiryDate:"",cardNumber:"",agentCode:"",trainings:[]}; ag.license.cardExpiryDate = iso; saveState(); } }
  else if (id==="new-training"){ newTrainingDraft.date = iso; }
  else if (id.startsWith("ev-start|") || id.startsWith("ev-end|")){ const ev=evAll()[Number(id.split("|")[1])]; if (ev){ if (id.startsWith("ev-start|")) ev.start = iso; else ev.end = iso; saveState(); } }
  else if (id==="coach-date"){ coachDraft.date = iso; }
  else if (id==="coach-follow"){ coachDraft.followUp = iso; }
  else if (id.startsWith("recruit-next|") || id.startsWith("recruit-card|")){ const r=(state.recruits||[]).find(x=>x.id===id.split("|")[1]); if (r){ if (id.startsWith("recruit-next|")) r.nextDate = iso; else r.cardDate = iso; saveState(); } }
  else if (id.startsWith("premium|")){
    const parts = id.split("|");
    const name = decodeURIComponent(parts[1]);
    const idx = Number(parts[2]);
    const premiums = getNormalizedPremiums(name);
    premiums[idx].date = iso;
    if (!state.umGoal.newAgentPremiums) state.umGoal.newAgentPremiums = {};
    state.umGoal.newAgentPremiums[name] = premiums;
    saveState();
  }
}

function confirmAddAgent(){
  const name = newAgentNameInput.trim();
  if (!name){ showToast("กรุณากรอกชื่อตัวแทน"); return; }
  if (state.agents[name]){ showToast("มีชื่อนี้อยู่แล้ว"); return; }
  state.agents[name] = JSON.parse(JSON.stringify(DEFAULT_AGENT_DATA));
  state.currentAgent = name;
  addAgentMode = false;
  syncAgentFormState();
  saveState(); render();
}

function installmentLabel(billingMode, i, n){
  // รายเดือน: งวดแรกจ่ายล่วงหน้า 2 เดือน = นับเป็นงวดที่ 1 และงวดที่ 2 พร้อมกัน เดือนถัดไปที่จ่ายจริงจึงเริ่มที่งวดที่ 3
  if (billingMode==="monthly"){
    const totalConceptual = n+1; // 11 รายการจริง แทน 12 งวดตามแนวคิด (เพราะงวดแรกนับ 2 งวดรวด)
    if (i===0) return `ปีที่ 1 งวดที่ 1-2/${totalConceptual}`;
    return `ปีที่ 1 งวดที่ ${i+2}/${totalConceptual}`;
  }
  return `ปีที่ 1 งวดที่ ${i+1}/${n}`;
}
function submitEntry(){
  const errBox = document.getElementById("form-error");
  const rawFyc = stripCommas(entryForm.fyc);
  if (!entryForm.date){ errBox.innerHTML = `<div class="err-box">กรุณาเลือกวันที่ทำสัญญา</div>`; return; }
  if (!entryForm.billing){ errBox.innerHTML = `<div class="err-box">กรุณาเลือกลักษณะการเก็บเบี้ย</div>`; return; }
  if (!rawFyc || isNaN(Number(rawFyc)) || Number(rawFyc)<=0){ errBox.innerHTML = `<div class="err-box">กรุณากรอกยอด FYC ให้ถูกต้อง (มากกว่า 0)</div>`; return; }
  errBox.innerHTML = "";

  const perInstallmentFyc = Number(rawFyc);
  // เตือนความผิดปกติที่มักเกิดจากพิมพ์พลาด — ไม่บังคับแก้ แค่ให้เช็คซ้ำก่อนบันทึกจริง
  const warnings = [];
  if (perInstallmentFyc >= 1000000){
    warnings.push(`FYC ${THB(perInstallmentFyc)} สูงผิดปกติมาก (เกิน 1 ล้านบาทต่องวด) — พิมพ์เลข 0 เกินไปหรือเปล่า?`);
  }
  const entryDate = new Date(entryForm.date+"T00:00:00");
  const daysFromToday = Math.round((entryDate-new Date())/86400000);
  if (daysFromToday > 90){
    warnings.push(`วันที่ ${fmtTH(entryDate,{day:"numeric",month:"long",year:"numeric"})} อยู่ล่วงหน้าเกิน 90 วันจากวันนี้ — ใช่วันที่ที่ตั้งใจไหม?`);
  }
  const firstSaleDate = agent().competitions?.firstSaleDate;
  if (firstSaleDate){
    const fsd = new Date(firstSaleDate+"T00:00:00");
    if (entryDate < fsd){
      warnings.push(`วันที่นี้อยู่ก่อน "วันที่มีผลงานขึ้นแรก" ของตัวแทนคนนี้ (${fmtTH(fsd,{day:"numeric",month:"long",year:"numeric"})}) — ถ้าไม่ตรงกัน อาจกระทบการคำนวณ Joining Bonus/ค่าเสริมมือ`);
    }
  }
  if (warnings.length){
    const proceed = confirm(`⚠ พบข้อสังเกตก่อนบันทึก:\n\n${warnings.map(w=>"· "+w).join("\n\n")}\n\nยืนยันจะบันทึกต่อไหม?`);
    if (!proceed) return;
  }

  const schedule = buildInstallmentSchedule(entryForm.billing, perInstallmentFyc);
  const n = schedule.length;
  const baseNote = entryForm.note.trim();
  const policyId = `p_${Date.now()}`;
  // ทุกรายการเริ่มเป็นรอพิจารณา เว้นแต่ติ๊ก "อนุมัติแล้ว" ในฟอร์ม (ใช้ตอนคีย์งานเก่าที่อนุมัติไปแล้ว)
  const isApproved = !!entryForm.approved;
  const list = schedule.map((s,i)=>({
    id: Date.now()+i,
    date: addMonthsToDate(entryForm.date, s.offset),
    fyc: s.amount,
    note: n>1 ? `${baseNote}${baseNote?" ":""}(${installmentLabel(entryForm.billing, i, n)})` : baseNote,
    policyId, installmentIndex:i, installmentTotal:n, billingMode: entryForm.billing,
    ...(i===0 && !isApproved ? { pending: true } : {}),
    ...(i===0 && Number(stripCommas(entryForm.premium||""))>0 ? { premium: Number(stripCommas(entryForm.premium)) } : {}),
    ...(i===0 && (entryForm.plan||"").trim() ? { plan: entryForm.plan.trim() } : {}), // เฉพาะงวดต้นฉบับที่มีสถานะรอพิจารณาของตัวเอง งวดต่อเนื่องอื่นๆ อิงตามงวดต้นฉบับเสมอ ไม่มีสถานะแยกของตัวเอง
  }));
  agent().entries.push(...list);
  saveState();
  entryForm = { ...entryForm, fyc:"", note:"", billing:"", approved:false, premium:"", plan:"" };
  render();
  const justAdded = document.getElementById("just-added");
  if (justAdded){
    justAdded.style.display="inline-flex";
    setTimeout(()=>{ if(justAdded) justAdded.style.display="none"; }, 2000);
  }
  if (document.activeElement instanceof HTMLElement) document.activeElement.blur();
}

function bPodSum(g, buckets, todos){
  const S = betaSum || {};
  const T = n => THB(n||0);
  if (g==='perf'){
    const pct = S.annualGoal>0 ? `เป้าปี <b class="${S.annualPct>=100?'ok':''}">${Math.round(S.annualPct)}%</b>` : 'ยังไม่ตั้งเป้าทั้งปี';
    return `${pct}<br>CFYC เดือนนี้ <b>${T(S.monthCFYC)}</b>`;
  }
  if (g==='comp'){
    const now = new Date();
    const act = evList().filter(ev=>now>=new Date(ev.start+"T00:00:00") && now<=new Date(ev.end+"T23:59:59"));
    const soon = act.map(ev=>Math.round((new Date(ev.end+"T23:59:59")-now)/86400000)).sort((a,b)=>a-b)[0];
    let pg=''; try{ const ps = programStatus(state, selYear); if (ps.type==='growth' && ps.base) pg = `Growth <b class="${ps.tier?'ok':'warn'}">${ps.growth.toFixed(0)}%</b>`; else if (ps.type==='fast' && !ps.out) pg = `Fast <b class="${ps.pass?'ok':'warn'}">${ps.pass?'ผ่าน':'ยังไม่ผ่าน'}</b>`; }catch(e){}
    return `กำลังแข่ง <b>${act.length}</b> รายการ${soon!==undefined?` · จบใน <b class="warn">${soon}</b> วัน`:''}${pg?`<br>${pg}`:''}`;
  }
  if (g==='alert'){
    const n = bAlertCount(buckets, todos);
    const first = todos.find(t=>t.g==='alert');
    return n ? `ต้องดูแล <b class="hot">${n}</b> เรื่อง<br>${first?esc(first.t.slice(0,26)):`จับตา <b class="warn">${bWatchN}</b> คน`}` : 'ไม่มีเรื่องด่วน<br><b class="ok">เรียบร้อย</b>';
  }
  if (g==='team') return `ตัวแทน <b>${S.agentCount||0}</b> คน<br>ไม่มีงานเดือนนี้ <b class="${S.quietCount?'warn':'ok'}">${S.quietCount||0}</b>`;
  if (g==='coach'){
    const t0 = new Date(); t0.setHours(0,0,0,0);
    let late=0, open=0;
    Object.values(state.agents||{}).forEach(ag=>{ const ns=(ag.coaching||[]); const last=ns.map(n=>n.date).sort().pop(); if (!last || (t0-new Date(last+"T00:00:00"))/86400000>COACH_GAP_DAYS) late++; open += ns.filter(n=>!n.done && n.followUp).length; });

  }
  const last = metaCache.lastBackupAt ? new Date(metaCache.lastBackupAt) : null;
  const d = last ? Math.floor((Date.now()-last.getTime())/86400000) : null;
  return `แบ็กอัพล่าสุด<br><b class="${d===null||d>=3?'warn':'ok'}">${d===null?'ยังไม่เคย':d===0?'วันนี้':d+' วันก่อน'}</b>`;
}

function betaLayout(c){
  bNavSync();
  if (activeSection!=='um'){ betaGroup = null; return; }
  const L = bLayout();
  const kids = Array.from(c.children);
  const ask = c.querySelector('.ask-card');
  const backup = kids.find(n=>n.querySelector && n.querySelector('#btn-backup-now'));
  const buckets = { perf:[], comp:[], alert:[], team:[], coach:[] };
  kids.forEach(n=>{ if (n===ask || n===backup || n.nodeType!==1) return; const g=bGroupOf(n); n.style.setProperty('--gc', bG(g).c); buckets[g].push(n); });
  Object.keys(buckets).forEach(g=>{
    const ord = Array.isArray(L.cards[g]) ? L.cards[g] : [];
    buckets[g].sort((a,b)=>{ const ia=ord.indexOf(bCardKey(a)), ib=ord.indexOf(bCardKey(b)); return (ia<0?999:ia)-(ib<0?999:ib); });
  });
  const todos = bTodos(c);

  // เปิดหมวดครั้งแรก: เปิดกล่องเป้าหมาย (จากเรื่องที่ต้องทำ) หรือกล่องแรกของหมวดไว้ให้เลย แล้ววาดใหม่ 1 รอบ
  if (betaJustOpened && betaGroup && buckets[betaGroup]){
    betaJustOpened = false;
    const list = buckets[betaGroup];
    const target = betaFocus ? list.find(n=> betaFocus instanceof RegExp ? betaFocus.test(bCardTitle(n)) : bCardKey(n)===betaFocus) : list[0];
    if (target){ bOpenCard(target); betaFlashKey = betaFocus ? bCardKey(target) : null; betaLaunch = true; render(); return; }
  }

  const S = betaSum || {};

function bGaugeAnim(pct){
  betaGaugeDone = true;
  const arc=document.getElementById('b-arc'), num=document.getElementById('b-pct'); if (!arc) return;
  if (bCalm()){ arc.setAttribute('stroke-dashoffset', 314-314*Math.min(100,pct)/100); num.textContent=Math.round(pct)+'%'; return; }
  let t0=null; const step=ts=>{ t0=t0||ts; const k=Math.min(1,(ts-t0)/900), e=1-Math.pow(1-k,3), v=pct*e; const a=document.getElementById('b-arc'), m=document.getElementById('b-pct'); if(!a) return; a.setAttribute('stroke-dashoffset', 314-314*Math.min(100,v)/100); m.textContent=Math.round(v)+'%'; if(k<1) requestAnimationFrame(step); };
  requestAnimationFrame(step);
}

function bOpenGroup(g, el, focus){
  if (betaArr) return;
  const r = el ? el.getBoundingClientRect() : null;
  betaOrigin = r ? { x: r.left+r.width/2, y: r.top } : null;
  const go = ()=>{ betaGroup=g; betaFocus=focus||null; betaJustOpened=true; try{ history.pushState({bg:g},''); }catch(e){} window.scrollTo(0,0); render(); };
  if (!bCalm() && el){
    const pod = el.classList.contains('b-pod') ? el : null;
    if (pod){ pod.classList.remove('boom'); void pod.offsetWidth; pod.classList.add('boom'); }
    const w = document.getElementById('b-warp'); if (w && r){ w.style.setProperty('--wx',(r.left+r.width/2)+'px'); w.style.setProperty('--wy',(r.top+r.height/2)+'px'); w.classList.remove('go'); void w.offsetWidth; w.classList.add('go'); }
    bBoost = .6; setTimeout(go, 130);
  } else go();
}
function bCloseGroup(){ if (!betaGroup) return; if (history.state && history.state.bg) history.back(); else { betaGroup=null; render(); } }

function bMove(arr, i, d){ const j=i+d; if (j<0||j>=arr.length) return false; [arr[i],arr[j]]=[arr[j],arr[i]]; return true; }
function bBindLayout(c, todos){
  const L = bLayout();
  c.querySelectorAll('[data-b-arr]').forEach(b=>b.onclick=()=>{ betaArr=!betaArr; render(); });
  c.querySelectorAll('[data-b-back]').forEach(b=>b.onclick=()=>{ betaArr=false; bCloseGroup(); });
  c.querySelectorAll('[data-b-todo]').forEach(b=>b.onclick=()=>{ const t=todos[+b.dataset.bTodo]; bOpenGroup(t.g, b, t.f); });
  const deck = c.querySelector('#b-deck');
  if (deck){
    deck.onclick = e=>{
      const w=e.target.closest('.b-podw'); if (!w) return;
      const mv=e.target.closest('[data-b-gmv]');
      if (betaArr){ if (mv && bMove(L.groups, L.groups.indexOf(w.dataset.g), +mv.dataset.bGmv)){ saveState(); render(); } return; }
      bOpenGroup(w.dataset.g, w.querySelector('.b-pod'));
    };
    deck.onkeydown = e=>{ if ((e.key==='Enter'||e.key===' ') && e.target.classList.contains('b-pod')){ e.preventDefault(); e.target.click(); } };
    deck.onpointerdown = e=>{ const p=e.target.closest('.b-pod'); if (p && !betaArr && !e.target.closest('button')) p.classList.add('press'); };
    deck.onpointermove = e=>{ if (e.pointerType!=='mouse' || bCalm() || betaArr) return; const p=e.target.closest('.b-pod'); if (!p) return; const r=p.getBoundingClientRect(); p.style.setProperty('--ry',((e.clientX-r.left)/r.width-.5)*16+'deg'); p.style.setProperty('--rx',-((e.clientY-r.top)/r.height-.5)*16+'deg'); };
    deck.onpointerout = e=>{ const p=e.target.closest('.b-pod'); if (p && !p.contains(e.relatedTarget)){ p.style.setProperty('--rx','0deg'); p.style.setProperty('--ry','0deg'); } };
    if (betaArr) bSortable(deck, '.b-podw', el=>el, ()=>{ L.groups = Array.from(deck.querySelectorAll('.b-podw')).map(x=>x.dataset.g); saveState(); render(); }, true);
  }
  c.querySelectorAll('[data-b-list]').forEach(list=>{
    const g = list.dataset.bList; if (g==='set'){ bBindSettings(list); return; }
    const keys = ()=>Array.from(list.querySelectorAll(':scope > .b-citem')).map(x=>x.dataset.k);

      if (bMove(ks, i, +mv.dataset.bCmv)){ L.cards[g] = ks; saveState(); render(); }
    };
    if (betaArr) bSortable(list, ':scope > .b-citem', el=>el.querySelector('.h'), ()=>{ L.cards[g] = keys(); saveState(); render(); }, false);
  });
}

/* ลากเพื่อจัดเรียง: เมาส์ลากได้ทันที · นิ้วแตะค้าง 0.3 วิ (หมวด) หรือจับที่แถบชื่อ (กล่อง) */
let bDrag = null;
function bSortable(container, sel, handleOf, done, longPress){
  const items = ()=>Array.from(container.querySelectorAll(sel));
  items().forEach(el=>{
    const h = handleOf(el); if (!h) return;
    let timer = null;
    h.onpointerdown = e=>{
      if (e.target.closest('button')) return;
      const start = ()=>{
        const r = el.getBoundingClientRect(), g = el.cloneNode(true);
        g.classList.add('b-ghost'); Object.assign(g.style,{ width:r.width+'px', left:r.left+'px', top:r.top+'px' }); document.body.appendChild(g);
        el.classList.add('b-dragging'); bDrag = { el, g, dx:e.clientX-r.left, dy:e.clientY-r.top, container, sel, done };
        try{ navigator.vibrate && navigator.vibrate(15); }catch(_){}
      };
      if (e.pointerType==='mouse' || !longPress) start(); else timer = setTimeout(start, 300);
      const cancel = ()=>{ clearTimeout(timer); h.removeEventListener('pointerup', cancel); };
      h.addEventListener('pointerup', cancel);
      h.addEventListener('touchmove', ()=>{ if (!bDrag) clearTimeout(timer); }, { passive:true, once:true });
    };
    h.oncontextmenu = e=>e.preventDefault();
  });
}
addEventListener('pointermove', e=>{
  if (!bDrag) return; e.preventDefault();
  bDrag.g.style.left = (e.clientX-bDrag.dx)+'px'; bDrag.g.style.top = (e.clientY-bDrag.dy)+'px';
  const over = document.elementFromPoint(e.clientX, e.clientY);
  const tgt = over && over.closest(bDrag.sel.replace(':scope > ',''));
  if (tgt && tgt!==bDrag.el && tgt.parentElement===bDrag.el.parentElement){
    const sib = Array.from(tgt.parentElement.children);
    if (sib.indexOf(tgt) > sib.indexOf(bDrag.el)) tgt.after(bDrag.el); else tgt.before(bDrag.el);
  }
}, { passive:false });
const bEndDrag = ()=>{ if (!bDrag) return; const d=bDrag; bDrag=null; d.g.remove(); d.el.classList.remove('b-dragging'); d.done(); };
addEventListener('pointerup', bEndDrag); addEventListener('pointercancel', bEndDrag);
document.addEventListener('touchmove', e=>{ if (bDrag) e.preventDefault(); }, { passive:false });

/* ปัดจากขอบซ้ายเพื่อกลับ */
let bSX = null, bSY = 0;
document.addEventListener('touchstart', e=>{ const t=e.touches[0]; bSX = (betaGroup && t.clientX<32) ? t.clientX : null; bSY=t.clientY; }, { passive:true });
document.addEventListener('touchend', e=>{ if (bSX===null) return; const t=e.changedTouches[0]; if (t.clientX-bSX>80 && Math.abs(t.clientY-bSY)<70){ betaArr=false; bCloseGroup(); } bSX=null; }, { passive:true });

function bBindSettings(box){
  box.querySelectorAll('[data-b-pref]').forEach(t=>t.onclick=()=>{ const k=t.dataset.bPref; bPrefs[k]=!bPrefs[k]; bSavePrefs(); bApplyPrefs(); t.setAttribute('aria-checked', bPrefs[k]); });
