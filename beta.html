function bSnapshotOnce(){
  const snap = ()=>({ at:new Date().toISOString(), data: JSON.parse(JSON.stringify(rootStateForSave())) });
  if (__useIdb){
    idbGet('beta-snapshot').then(s=>{ if (s && s.at){ betaSnapAt=s.at; return; } const v=snap(); return idbPut('beta-snapshot', v).then(()=>{ betaSnapAt=v.at; }); }).catch(()=>{});
  } else {
    try{ const s=JSON.parse(localStorage.getItem('ped-beta-snapshot')||'null'); if (s && s.at){ betaSnapAt=s.at; return; } const v=snap(); localStorage.setItem('ped-beta-snapshot', JSON.stringify(v)); betaSnapAt=v.at; }catch(e){}
  }
}
function bRestoreSnapshot(){
  const apply = s=>{
    if (!s || !s.data){ showToast('ไม่พบข้อมูลสำรอง'); return; }
    if (!confirm(`กู้คืนข้อมูลเป็นชุดที่สำรองไว้เมื่อ ${fmtTH(new Date(s.at),{day:"numeric",month:"short",year:"numeric",hour:"2-digit",minute:"2-digit"})}?\n\nสิ่งที่บันทึกหลังจากนั้นจะหายไป (แนะนำให้กด 📤 แบ็กอัพชุดปัจจุบันไว้ก่อน)`)) return;
    activeTeamUmName = null; mainAppState = null;
    state = normalizeState(s.data); saveState(); flushSave(); refreshInputsAfterLoad(); betaGroup=null; render(); showToast('กู้คืนข้อมูลแล้ว');
  };
  if (__useIdb) idbGet('beta-snapshot').then(apply).catch(()=>showToast('อ่านข้อมูลสำรองไม่สำเร็จ'));
  else { try{ apply(JSON.parse(localStorage.getItem('ped-beta-snapshot')||'null')); }catch(e){ showToast('อ่านข้อมูลสำรองไม่สำเร็จ'); } }

    if (k==='home'){ activeSection='um'; betaGroup=null; }
    else if (k==='set'){ activeSection='um'; betaGroup='set'; }
    else { activeSection=k; betaGroup=null; if (k==='agent' && !['goals','entry','competitions'].includes(activeTab)) activeTab='goals'; }
    render(); window.scrollTo({ top:0, behavior:'auto' });
  };
  fab.onclick = ()=>{
    if (activeTeamUmName){ showToast(`กำลังดูทีมของ ${activeTeamUmName} — กด "← กลับของฉันเอง" ก่อน`); return; }
    betaGroup=null; betaArr=false; activeSection='agent'; activeTab='entry'; closeAllCalendars(); render();
    const f=document.getElementById('entry-form'); if (f) f.scrollIntoView({ block:'start', behavior: bCalm()?'auto':'smooth' });
  };
}
function bNavSync(){
  const cur = activeSection==='um' ? (betaGroup==='set'?'set':'home') : activeSection;
  document.querySelectorAll('[data-b-nav]').forEach(b=>b.classList.toggle('on', b.dataset.bNav===cur));
  const fab = document.getElementById('b-fab'); if (fab) fab.hidden = (activeSection==='agent' && activeTab==='entry');
}

/* ---------- ฉากหลังดาว ---------- */
let bBoost = 0, bSkyRun = false, bStars = [], bCv = null, bCx = null, bW = 0, bH = 0;
function bSkyInit(){
  if (bCv) return;
  bCv = document.createElement('canvas'); bCv.id='b-sky'; bCv.setAttribute('aria-hidden','true');
  const pl = document.createElement('div'); pl.id='b-planet'; pl.setAttribute('aria-hidden','true');
  document.body.prepend(pl); document.body.prepend(bCv); bCx = bCv.getContext('2d');
  const size = ()=>{ const d=Math.min(2, devicePixelRatio||1); bW=bCv.width=innerWidth*d; bH=bCv.height=innerHeight*d; bStars = Array.from({length:Math.round(innerWidth*innerHeight/2600)},()=>({ x:Math.random()*bW, y:Math.random()*bH, z:Math.random() })); bDraw(); };
  addEventListener('resize', size); size();
  document.addEventListener('visibilitychange', ()=>{ if (!document.hidden) bSkyStart(); });
}
function bDraw(){
  if (!bCx) return;
  bCx.fillStyle = bBoost>.05 ? 'rgba(3,6,15,.35)' : '#03060F'; bCx.fillRect(0,0,bW,bH);
  const mx=bW/2, my=bH*.35, moving = !bCalm();
  for (const s of bStars){
    if (moving){
      const sp=(.15+s.z*.6)*(1+bBoost*40);
      if (bBoost>.05){ const dx=s.x-mx, dy=s.y-my, d=Math.hypot(dx,dy)||1; s.x+=dx/d*sp; s.y+=dy/d*sp; if (s.x<0||s.x>bW||s.y<0||s.y>bH){ s.x=mx+(Math.random()-.5)*60; s.y=my+(Math.random()-.5)*60; } }
      else { s.y+=sp*.4; if (s.y>bH) s.y=0; }
    }
    bCx.fillStyle=`rgba(${200+55*s.z|0},225,255,${.3+.7*s.z})`; const z=.6+s.z*1.8; bCx.fillRect(s.x,s.y,z,z*(1+bBoost*5));
  }
  bBoost*=.9;
}
function bSkyStart(){
  if (!bCx) return; bDraw();
  if (bSkyRun || bCalm() || bPrefs.light) return;
  bSkyRun = true; let last = 0;
  const loop = ts=>{ if (bCalm() || bPrefs.light || document.hidden){ bSkyRun=false; return; } if (ts-last>33){ last=ts; bDraw(); } requestAnimationFrame(loop); };
  requestAnimationFrame(loop);
}

bSkyInit(); bNavInit(); bApplyPrefs();
boot();

// ทุกช่องกรอก: แตะแล้วล้างค่าเดิมทันที ถ้าไม่พิมพ์อะไรแล้วออก ให้คืนค่าเดิม (ไม่ต้องคอยลบเอง)
(function(){
  const SKIP = ['checkbox','radio','button','submit','reset','file','range','color','hidden','date','time','datetime-local','month','week'];
  const ok = el => el && el.tagName==='INPUT' && !SKIP.includes((el.type||'text').toLowerCase()) && !el.readOnly && !el.disabled && el.id!=='entry-search';
  document.addEventListener('focus', e=>{ const el = e.target; if (!ok(el)) return; el.dataset.prevVal = el.value; if (el.value!=='') el.value = ''; }, true);
  document.addEventListener('blur', e=>{ const el = e.target; if (!ok(el)) return; const prev = el.dataset.prevVal; delete el.dataset.prevVal; if (prev!==undefined && prev!=='' && el.value.trim()==='') el.value = prev; }, true);
})();
</script>
